# The decide tool (case decide_tool): the model asks a decider, which runs
# as a child on a decision model, and goes on with its answer.
steps:
  - match: {path: /v1/chat/completions, last_role: user, body_contains: K1}
    response:
      choices:
        - message:
            role: assistant
            content: null
            tool_calls:
              - id: call_k1
                type: function
                function:
                  name: decide
                  arguments: '{"decider":"gate","input":"rm -rf build K1"}'
          finish_reason: tool_calls
      usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
  - match: {path: /v1/systemone, body_contains: K1}
    response:
      answers:
        decision: {type: choice, choice: safe, probabilities: {safe: 0.93, risky: 0.07}}
  - match: {path: /v1/chat/completions, last_role: tool}
    response:
      choices:
        - message: {role: assistant, content: "The gate says safe."}
          finish_reason: stop
      usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
  - match: {path: /v1/chat/completions, body_contains: K2}
    response:
      choices:
        - message: {role: assistant, content: "No deciders here."}
          finish_reason: stop
      usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
