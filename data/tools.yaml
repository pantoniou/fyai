# Built-in tool specifications in wire shape (see doc/tools-yaml.md).
#
# This document is the single source of truth for the built-in tools.
# It is embedded at configure time (embedded_tools.inc) and parsed by
# make_tools() in src/fyai_tool_spec.c. Descriptions are byte-identical to
# what the model provider, `fyai catalog` markdown, and the tool-spec unit
# tests consume, so keep them in sync with tests/fyai_tool_spec_test.c.
#
# Tool order is fixed: read_file, write_file, apply_patch, shell, shell_input,
# shell_output, shell_close, ask_user, agent, todo_write, time, wait.
- type: function
  function:
    name: read_file
    description: |-
      Read a UTF-8 text file from the workspace.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: |-
            Workspace-relative path to read.
        offset:
          type: integer
          description: >-
            Optional 1-based line to start at. Use it with the offset the result reports to read on
            through a large file.
        offset_bytes:
          type: integer
          description: >-
            Optional zero-based byte offset. It takes precedence over offset and lets a later call
            continue after a byte-limited result.
        limit:
          type: integer
          description: |-
            Optional number of lines to return. Omit to read to the end of the file.
        max_bytes:
          type: integer
          description: >-
            Optional cap on the bytes returned. A larger window is truncated and the result says so.
            Omit for the configured default.
      required:
        - path
      additionalProperties: false
- type: function
  function:
    name: write_file
    description: |-
      Write UTF-8 text to a workspace file. Missing parent directories are created.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: |-
            Workspace-relative path to write.
        content:
          type: string
          description: |-
            Complete UTF-8 file contents.
      required:
        - path
        - content
      additionalProperties: false
# Keep the apply_patch description exact and complete. Distilled claude
# models make many patch-format errors without it.
- type: function
  function:
    name: apply_patch
    description: >-
      Apply a patch to workspace files. Prefer a unified diff: one "--- a/path" and "+++ b/path"
      header per file, then "@@ -old,count +new,count @@" hunks whose rows start with a space
      (context), "-" (removed) or "+" (added). Use /dev/null as the old path to add a file and as
      the new path to delete one. Line numbers are advisory; hunks are matched by their context. A
      Codex-style *** Begin Patch / *** End Patch envelope is also accepted.
    parameters:
      type: object
      properties:
        patch:
          type: string
          description: |-
            Complete patch text to apply, as a unified diff.
      required:
        - patch
      additionalProperties: false
- type: function
  function:
    name: exec_command
    description: |-
      Run a shell command in the workspace.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: |-
            Shell command to execute.
        tty:
          type: boolean
          description: |-
            Run the command in a pseudo-terminal and return the rendered screen
            with the lines that scrolled off it, instead of the raw byte stream.
            Without it the command runs on pipes and finds no terminal, which
            is what you want for a command whose output you are reading: a
            program that paginates for a person does not paginate on a pipe.
            Ask for a terminal for a program that needs one, such as a
            full-screen editor, and with `name` for a session you will drive.
            A session needs one: `name` without `tty` is refused. A program
            that waits for input will wait until the time limit expires.
        name:
          type: string
          description: >-
            Name this shell to keep it open as a session, instead of running one command to
            completion. It needs `tty`, because a session is a program you drive as a person would:
            a name without it is refused, and the command runs to completion instead. The command
            keeps its own process until it ends or you close it, and you reach it by this name with
            shell_input, shell_output and shell_close. Use it for a program that expects a person:
            an editor, a pager, a REPL, a prompt for a password. The name must be unique among the
            sessions you have open, and describes what the shell is for (letters, digits, '-' or
            '_'). The call returns as soon as the terminal exists; read it when you want.
        shell:
          type: string
          description: |-
            Shell to run the command under. Defaults to `/bin/sh`. Name
            another shell for a command that uses what that shell adds; a
            name is looked up on PATH, as any other command is.
        login:
          type: boolean
          description: |-
            Run the shell as a login shell, so that it reads the profile of
            the user. Ask for it when a command needs a tool or a variable
            that the profile of the user sets up, such as a version manager
            that puts an interpreter on the path. It costs the time the
            profile takes, so leave it out for a command that does not need
            it.
        rows:
          type: integer
          description: |-
            Rows of the pseudo-terminal. Defaults to the terminal of the user,
            or 24.
        cols:
          type: integer
          description: |-
            Columns of the pseudo-terminal. Defaults to the terminal of the
            user, or 80.
        workdir:
          type: string
          description: >-
            Optional directory to run the command in, absolute or workspace-relative. Prefer this
            over a leading `cd`.
        timeout:
          type: integer
          description: |-
            Optional time limit in milliseconds. The command is stopped when it expires.
        max_output_tokens:
          type: integer
          description: >-
            Optional cap on the output returned. Longer output keeps its end and the result says how
            much was elided. Omit for the configured default.
        description:
          type: string
          description: >-
            Optional short (3-5 word) description of what the command does, used as its label in the
            display.
      required:
        - command
      additionalProperties: false
- type: function
  function:
    name: shell_input
    description: >-
      Type into a terminal session opened by `exec_command` with a name. The text is sent as
      keystrokes, so control characters work: use \u0003 for Ctrl-C, \u001b for escape, \u0004 for
      end of input. Returns what the program showed afterwards, in the same shape as shell_output.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the session to type into.
        input:
          type: string
          description: |-
            The characters to send.
        enter:
          type: boolean
          description: >-
            Append a carriage return, as a person pressing return would. True by default; set it to
            false to send raw keys.
        wait_ms:
          type: integer
          description: >-
            Time to let the program answer before the output is read. Defaults to 250 ms. A program
            that needs longer can be read again with shell_output.
        idle_trigger:
          type: integer
          description: >-
            Time the session must write nothing before the keystrokes are sent. Defaults to 100 ms.
            A program that is still starting has not taken its terminal and loses what is typed at
            it, so raise this for one that is slow to draw its first screen; a program stopped for
            input writes nothing and is answered at once.
        max_wait:
          type: integer
          description: >-
            Time after which the keystrokes are sent whatever the program is doing. Defaults to 5000
            ms. It bounds `idle_trigger` for a program that never stops writing.
        view:
          type: string
          enum:
            - new
            - screen
            - all
          description: |-
            Which reading to return afterwards. Defaults to `new`.
      required:
        - name
        - input
      additionalProperties: false
- type: function
  function:
    name: shell_output
    description: >-
      Read a terminal session opened by `exec_command` with a name, without typing into it. A
      program that only writes lines is returned as lines, whole and in order. A program that draws
      a screen is returned as the screen it drew, which is the only useful reading of it. A session
      can be read after its program has ended.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the session to read.
        view:
          type: string
          enum:
            - new
            - screen
            - all
            - region
          description: >-
            `new` returns what appeared since your last read, and is the usual choice. `screen`
            returns the whole screen. `all` returns everything the session has produced. `region`
            returns a part of the screen, for a program that draws one.
        region:
          type: object
          description: |-
            The part of the screen to return, with `view: region`. Rows and columns count from 0.
          properties:
            row:
              type: integer
            col:
              type: integer
            rows:
              type: integer
            cols:
              type: integer
          additionalProperties: false
      required:
        - name
      additionalProperties: false
- type: function
  function:
    name: shell_close
    description: >-
      End a terminal session. The program is asked to stop and killed if it does not. Prefer driving
      the program out itself, such as `:q!` in an editor, so that it can save or restore what it
      owns.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the session to end.
        force:
          type: boolean
          description: |-
            Kill the program at once instead of asking it to stop.
      required:
        - name
      additionalProperties: false
- type: function
  function:
    name: monitor
    description: >-
      Watch a long-running command: it runs in the background, and each complete line it prints
      reaches you as an event, `[monitor 'NAME'] line`, between your tool calls. Its end is the last
      event: `[monitor 'NAME' ended]`. Use it for many events, such as every error line of a log or
      every step of a build. For a single "tell me when it is ready" use `exec_command` with `name`
      or a `wait` instead. Stdout and stderr are both events, so filter the command to the lines you
      would act on, and make every pipe stage flush per line (`grep --line-buffered`). Match every
      way the job can end, not only success: silence looks the same as a job that is still running.
      A monitor that sends more than 200 events is stopped. It ends when the command ends or its
      time limit passes, and `cancel` stops it. `wait` with `for` holds your turn until it reports.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            Name for this monitor (letters, digits, '-' or '_'), unique among your monitors. Events
            and `cancel` use it.
        command:
          type: string
          description: |-
            Shell command to run. Each line it writes is an event; its exit ends the monitor.
        description:
          type: string
          description: |-
            Short label of what is watched, shown to the user.
        timeout:
          type: integer
          description: >-
            Time limit in milliseconds. The default is 300000 (5 minutes) and the most is 1800000
            (30 minutes). The command is stopped when it expires, and you start it again to go on.
        workdir:
          type: string
          description: |-
            Optional directory to run the command in.
      required:
        - name
        - command
      additionalProperties: false
- type: function
  function:
    name: cancel
    description: >-
      Stop something you started in the background, by its name: a named `wait`, a sub-agent (also
      one started with `background`), a `monitor`, a question put to the user with a name, or an
      open terminal session. Stopping a sub-agent
      also stops the processes it started, and you are told in a new turn that it ended. A terminal
      session is killed at once; use `shell_close` instead if the program should save its work. Use
      `list` to see what is open.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the wait, sub-agent, monitor, question or session to cancel.
        kind:
          type: string
          enum: [wait, agent, shell, monitor, question]
          description: >-
            What the name refers to. Omit it when the name is unique among your waits, sub-agents,
            monitors, questions and sessions.
      required:
        - name
      additionalProperties: false
- type: function
  function:
    name: agent_input
    description: |-
      Answer a sub-agent that is running and waiting for input. You are told
      when one stops for input, with what it asked; this types the answer on
      its terminal, exactly as a person at that terminal would. A sub-agent
      that has finished is not typed into: call `agent` with its name to ask
      it something new.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the running sub-agent to answer.
        input:
          type: string
          description: |-
            The characters to send. Control characters work: use \u0003 for
            Ctrl-C and \u001b for escape.
        enter:
          type: boolean
          description: |-
            Append a carriage return, as a person pressing return would. True
            by default; set it to false to send raw keys.
      required:
        - name
        - input
      additionalProperties: false
- type: function
  function:
    name: ask_user
    description: >-
      Ask the user one to four questions and wait for the answers. Use this when you need a decision
      or clarification only the user can give. Each question offers two to four options. The user
      can always type another answer, so do not add an "Other" option. Put the option you recommend
      first and end its label with "(Recommended)". Set multi_select when more than one option can
      apply. Give an option a preview when the choice is easier to judge by looking at it, such as a
      layout or a diagram; a preview is Markdown and shows beside the options of a question that
      allows one choice. Set `background` to ask without holding your turn: the call returns at once
      with the name of the question, you keep working, and you are told when the user has answered.
      `wait` for the name to hold a call for the answer, `list` with kind `questions` to see what
      still waits, and `cancel` to take a question back. From a sub-agent the questions go to whoever delegated the work, who puts
      them to the user and sends the answers back.
    parameters:
      type: object
      properties:
        questions:
          type: array
          description: |-
            The questions to put to the user, asked together. One to four.
          minItems: 1
          maxItems: 4
          items:
            type: object
            properties:
              id:
                type: string
                description: >-
                  Optional stable name of the question, used in the answer. Defaults to q1, q2 and
                  so on.
              header:
                type: string
                description: |-
                  A short label for the question, at most 12 characters, such as "Scope".
                maxLength: 12
              question:
                type: string
                description: |-
                  The complete question, ending with a question mark.
              multi_select:
                type: boolean
                description: |-
                  Allow more than one option to be chosen. Defaults to false.
              options:
                type: array
                description: |-
                  The choices, two to four, each distinct.
                minItems: 2
                maxItems: 4
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: >-
                        Optional stable name of the option, used in the answer. Defaults to the
                        label.
                    label:
                      type: string
                      description: |-
                        The text of the choice, one to five words.
                    description:
                      type: string
                      description: |-
                        What the choice means or what follows from it.
                    preview:
                      type: string
                      description: >-
                        Optional Markdown shown while the option is selected. Only for a question
                        with one choice. A fenced mermaid block is drawn as a diagram.
                  required:
                    - label
                    - description
                  additionalProperties: false
            required:
              - question
              - header
              - options
            additionalProperties: false
        background:
          type: boolean
          description: >-
            Ask without holding your turn. The call returns at once and you are told when the user
            has answered. Defaults to false: the call waits for the answers. A call that gives a
            `name` is a background call too.
        name:
          type: string
          description: >-
            Optional name of a background question, for `wait`, `list` and `cancel`. It can use
            letters, digits, '-' and '_', and it must differ from every other open question. Left
            out, the question is named ask-1, ask-2 and so on.
      required:
        - questions
      additionalProperties: false
- type: function
  function:
    name: agent
    description: >-
      Delegate a self-contained sub-task to an autonomous sub-agent that runs
      its own tool-use loop in an isolated process and returns its final
      report. Use it for focused work you can describe completely up front
      (search, analysis, a multi-step edit); the sub-agent shares the
      workspace but not this conversation. Its final report comes back as the
      tool result and is not shown to the user - relay what matters. A
      sub-agent keeps its conversation under its name, so calling it again
      with that name goes back to the same one: ask it what it found, have it
      carry on, or give it the answer to something it asked. Its earlier work
      is still there and does not have to be repeated.
      {{project_isolation_description}}
    parameters:
      type: object
      properties:
        name:
          type: string
          description: >-
            A very short name for this sub-agent (at most 3 words). It is how you reach it: a new
            name starts a sub-agent, and a name you have used before goes back to that one, with
            everything it did still in its conversation. A sub-agent that is still running cannot be
            addressed - wait for its report.
        description:
          type: string
          description: |-
            A short (3-5 word) description of the delegated task, used as its label.
        task:
          type: string
          description: >-
            Complete, self-contained instructions for the sub-agent. For one you have called before,
            this is what you are asking it now; it remembers the rest.
        persona:
          type: string
          description: >-
            Optional named persona for the sub-agent, from the `agent/personas` configuration. A
            persona carries its own instructions and model settings. Omit it for the default
            sub-agent.
        context:
          type: string
          description: >-
            `fork` (the default) starts the sub-agent from this conversation,
            so it sees the context you already have; `fresh` starts it from
            the task alone, which is cheaper for self-contained work. It is
            read only when the sub-agent starts: one you are going back to
            keeps the conversation it has.
        timeout:
          type: integer
          description: >-
            Optional time limit in milliseconds. The sub-agent and every process it started are
            stopped when it expires.
        isolated:
          type: boolean
          description: >-
            True runs the sub-agent on a private copy of the project, and false on the project
            itself. Omit it to use the default.
        background:
          type: boolean
          description: >-
            True starts the sub-agent and returns at once, without holding your turn. Keep working
            meanwhile: when the sub-agent ends, its final report is given to you in a new turn. Use
            it for work that does not block your next step, and to run several sub-agents beside
            other work. The default, false, waits for the report and returns it as the result. Do
            not poll a background sub-agent; `list` shows its state, and `agent_input` answers it
            when it waits for input.
      required:
        - name
        - description
        - task
      additionalProperties: false
  templates:
    project_isolation_description:
      default: >-
        Sub-agents are isolated by default: each works on a private copy of the
        project, and its changes do not reach the project until you apply them
        with the `project_view` tool. Set `isolated` to false to give a
        sub-agent the project itself.
      optional: >-
        You can set `isolated` to true to run a sub-agent on a private copy of
        the project. Its changes do not reach the project until you apply them
        with the `project_view` tool.
- type: function
  function:
    name: project_view
    description: >-
      Work with the project views that the sub-agents you started leave. A sub-agent that ran with
      `isolated` changed its own private copy of the project, not the project; its report names it.
      Use the `list` tool to see which sub-agents left a view. `changes` lists what one changed
      against its baseline, and `apply` writes those changes into the project. You reach only the
      sub-agents you started, by the name you gave them. A sub-agent of another agent, a view of the
      user and a branch are not reachable. Apply only takes a path that the project still has as the
      baseline had it: a path that you or another agent changed since is reported as a conflict and
      is left alone. Name `paths` to apply only those paths and what is beneath them. Use `dry_run`
      to see the outcome first. The user can review the same views with `view diff agent/NAME`.
    parameters:
      type: object
      properties:
        action:
          type: string
          enum: [changes, apply]
          description: |-
            `changes` of the view of one sub-agent, or `apply` it to the project.
        name:
          type: string
          description: >-
            The name that you gave the sub-agent, as its report names it. Required for `changes` and
            `apply`.
        paths:
          type: array
          description: |-
            For `apply`: project-relative paths to apply. Omit it to apply every change.
          items:
            type: string
        dry_run:
          type: boolean
          description: |-
            For `apply`: report what would change and write nothing.
      required:
        - action
      additionalProperties: false
- type: function
  function:
    name: list
    description: >-
      List what you can name in other calls. `agents`: the sub-agents you started, running or ended,
      with their state and whether they left a view for `project_view`. `views`: those views.
      `shells`: your open terminal sessions. `waits`: your pending named waits. `monitors`: your
      running monitors. `questions`: the questions you put to the user with a name that still wait
      for an answer. Each name is the one you gave it. You only see your own: those of the user and
      of other agents are not listed. Leave `kind` out to list all six.
    parameters:
      type: object
      properties:
        kind:
          type: string
          enum: [agents, views, shells, waits, monitors, questions]
          description: |-
            What to list. Omit it to list every kind.
      additionalProperties: false
- type: function
  function:
    name: todo_write
    description: >-
      Use this tool to create and manage a structured task list for your current coding session.
      This helps you track progress, organize complex tasks, and demonstrate thoroughness to the
      user. It also helps the user understand the progress of the task and overall progress of
      their requests.

      Use this tool proactively in these scenarios: complex multistep tasks with 3 or more
      distinct steps, non-trivial tasks that require careful planning or multiple operations, when
      the user explicitly requests a todo list, when the user provides multiple tasks, after
      receiving new instructions, after completing a task, and when you start working on a new
      task. Skip it for a single straightforward task, a trivial task, a task of less than 3
      trivial steps, or a purely conversational or informational task.

      Task states: pending (not yet started), in_progress (currently working on), completed
      (finished successfully), cancelled (no longer needed). Update task status in real-time as
      you work. Mark tasks complete immediately after finishing. Only have one task in_progress
      at any time. Complete current tasks before starting new ones. Cancel tasks that become
      irrelevant. Create specific, actionable items and break complex tasks into smaller steps.
    parameters:
      type: object
      properties:
        todos:
          type: array
          description: The updated todo list
          minItems: 1
          items:
            type: object
            properties:
              content:
                type: string
                description: Brief description of the task
              status:
                type: string
                description: 'Current status of the task: pending, in_progress, completed, cancelled'
                enum: [pending, in_progress, completed, cancelled]
              priority:
                type: string
                description: 'Priority level of the task: high, medium, low'
                enum: [high, medium, low]
            required:
              - content
              - status
              - priority
            additionalProperties: false
      required:
        - todos
      additionalProperties: false
- type: function
  function:
    name: time
    description: >-
      Report the current time. The system instructions are frozen when a conversation starts, so
      they cannot tell you what the time is now; ask for it when it matters, and to measure how long
      something took.
    parameters:
      type: object
      properties: {}
      additionalProperties: false
- type: function
  function:
    name: wait
    description: >-
      Wait for something you started to finish, or wait for a time. To wait for a background
      sub-agent, monitor, terminal session or question put to the user, give only `for`, with its
      name; add `poll` to look once and carry on instead of waiting. To wait for a time,
      give `seconds` or `until`; use this instead of a shell that sleeps. Give a time wait a `name`
      to run it in the background: the call returns at once, and you are told when the time is up.
    parameters:
      type: object
      properties:
        seconds:
          type: number
          description: |-
            How long to wait, in seconds. A fraction is allowed.
        until:
          type: string
          description: >-
            Wall-clock time to wait for, as `HH:MM`, `HH:MM:SS` or a full `YYYY-MM-DDTHH:MM:SS` in
            local time. A time that has passed does not wait.
        for:
          description: >-
            The name of what to wait for: a background sub-agent, a monitor, a terminal session, a
            question put to the user or a named wait. A list of up to 16 names is also allowed. The call returns when it has
            finished, with its report; you will not get the same report again later. A sub-agent or
            session that stops to ask for input counts as finished. Without `seconds` or `until` the
            call waits until the work is done. With one of them it stops waiting at that limit and
            says what is still running.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        poll:
          type: boolean
          description: >-
            Only with `for`. Look once and return at once: what has finished is reported, and what is
            still running is named. Nothing waits, and the call does not take `seconds` or `until`.
            Use it to check on background work and carry on.
        mode:
          type: string
          enum: [any, all]
          description: >-
            Only for a list in `for`. `any` (the default) returns when the first one has finished.
            `all` returns when all of them have finished. `seconds` or `until` still set the limit.
        name:
          type: string
          description: >-
            Gives a time wait a name and runs it in the background: the call returns at once, and
            you are told in a new turn when the time is up. Not for use with `for`. The name can use
            letters, digits, '-' and '_', and it must differ from every other open wait.
        reason:
          type: string
          description: >-
            Optional short note on what this wait is for. It is shown to the user and given back to
            you when the wait fires.
      additionalProperties: false
