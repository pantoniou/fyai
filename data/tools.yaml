# Built-in tool specifications in wire shape (see doc/tools-yaml.md).
#
# This document is the single source of truth for the built-in tools.
# It is embedded at configure time (embedded_tools.inc) and parsed by
# make_tools() in src/fyai_tool_spec.c. Descriptions are byte-identical to
# what the model provider, `fyai catalog` markdown, and the tool-spec unit
# tests consume, so keep them in sync with tests/fyai_tool_spec_test.c.
#
# Tool order is fixed: read_file, write_file, apply_patch, shell, shell_input,
# shell_output, shell_close, ask_user, agent, time, wait.
- type: function
  function:
    name: read_file
    description: |-
      Read a UTF-8 text file from the workspace.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: |-
            Workspace-relative path to read.
        offset:
          type: integer
          description: |-
            Optional 1-based line to start at. Use it with the offset the result reports to read on through a large file.
        offset_bytes:
          type: integer
          description: |-
            Optional zero-based byte offset. It takes precedence over offset and lets a later call continue after a byte-limited result.
        limit:
          type: integer
          description: |-
            Optional number of lines to return. Omit to read to the end of the file.
        max_bytes:
          type: integer
          description: |-
            Optional cap on the bytes returned. A larger window is truncated and the result says so. Omit for the configured default.
      required:
        - path
      additionalProperties: false
- type: function
  function:
    name: write_file
    description: |-
      Write UTF-8 text to a workspace file.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: |-
            Workspace-relative path to write.
        content:
          type: string
          description: |-
            Complete UTF-8 file contents.
      required:
        - path
        - content
      additionalProperties: false
# Keep the apply_patch description exact and complete. Distilled claude
# models make many patch-format errors without it.
- type: function
  function:
    name: apply_patch
    description: |-
      Apply a patch to workspace files. Prefer a unified diff: one "--- a/path" and "+++ b/path" header per file, then "@@ -old,count +new,count @@" hunks whose rows start with a space (context), "-" (removed) or "+" (added). Use /dev/null as the old path to add a file and as the new path to delete one. Line numbers are advisory; hunks are matched by their context. A Codex-style *** Begin Patch / *** End Patch envelope is also accepted.
    parameters:
      type: object
      properties:
        patch:
          type: string
          description: |-
            Complete patch text to apply, as a unified diff.
      required:
        - patch
      additionalProperties: false
- type: function
  function:
    name: shell
    description: |-
      Run a shell command in the workspace.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: |-
            Shell command to execute.
        tty:
          type: boolean
          description: |-
            Run the command in a pseudo-terminal and return the rendered screen
            with the lines that scrolled off it, instead of the raw byte stream.
            Without it the command runs on pipes and finds no terminal, which
            is what you want for a command whose output you are reading: a
            program that paginates for a person does not paginate on a pipe.
            Ask for a terminal for a program that needs one, such as a
            full-screen editor, and with `name` for a session you will drive.
            A session needs one: `name` without `tty` is refused. A program
            that waits for input will wait until the time limit expires.
        name:
          type: string
          description: |-
            Name this shell to keep it open as a session, instead of running one command to completion. It needs `tty`, because a session is a program you drive as a person would: a name without it is refused, and the command runs to completion instead. The command keeps its own process until it ends or you close it, and you reach it by this name with shell_input, shell_output and shell_close. Use it for a program that expects a person: an editor, a pager, a REPL, a prompt for a password. The name must be unique among the sessions you have open, and describes what the shell is for (letters, digits, '-' or '_'). The call returns as soon as the terminal exists; read it when you want.
        shell:
          type: string
          description: |-
            Shell to run the command under. Defaults to `/bin/sh`. Name
            another shell for a command that uses what that shell adds.
        login:
          type: boolean
          description: |-
            Run the shell as a login shell, so that it reads the profile of
            the user. Ask for it when a command needs a tool or a variable
            that the profile of the user sets up, such as a version manager
            that puts an interpreter on the path. It costs the time the
            profile takes, so leave it out for a command that does not need
            it.
        rows:
          type: integer
          description: |-
            Rows of the pseudo-terminal. Defaults to the terminal of the user,
            or 24.
        cols:
          type: integer
          description: |-
            Columns of the pseudo-terminal. Defaults to the terminal of the
            user, or 80.
        workdir:
          type: string
          description: |-
            Optional directory to run the command in, absolute or workspace-relative. Prefer this over a leading `cd`.
        timeout:
          type: integer
          description: |-
            Optional time limit in milliseconds. The command is stopped when it expires.
        max_output_tokens:
          type: integer
          description: |-
            Optional cap on the output returned. Longer output keeps its end and the result says how much was elided. Omit for the configured default.
        description:
          type: string
          description: |-
            Optional short (3-5 word) description of what the command does, used as its label in the display.
      required:
        - command
      additionalProperties: false
- type: function
  function:
    name: shell_input
    description: |-
      Type into a terminal session opened by `shell` with a name. The text is sent as keystrokes, so control characters work: use \u0003 for Ctrl-C, \u001b for escape, \u0004 for end of input. Returns what the program showed afterwards, in the same shape as shell_output.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the session to type into.
        input:
          type: string
          description: |-
            The characters to send.
        enter:
          type: boolean
          description: |-
            Append a carriage return, as a person pressing return would. True by default; set it to false to send raw keys.
        wait_ms:
          type: integer
          description: |-
            Time to let the program answer before the output is read. Defaults to 250 ms. A program that needs longer can be read again with shell_output.
        view:
          type: string
          enum:
            - new
            - screen
            - all
          description: |-
            Which reading to return afterwards. Defaults to `new`.
      required:
        - name
        - input
      additionalProperties: false
- type: function
  function:
    name: shell_output
    description: |-
      Read a terminal session opened by `shell` with a name, without typing into it. A program that only writes lines is returned as lines, whole and in order. A program that draws a screen is returned as the screen it drew, which is the only useful reading of it. A session can be read after its program has ended.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the session to read.
        view:
          type: string
          enum:
            - new
            - screen
            - all
            - region
          description: |-
            `new` returns what appeared since your last read, and is the usual choice. `screen` returns the whole screen. `all` returns everything the session has produced. `region` returns a part of the screen, for a program that draws one.
        region:
          type: object
          description: |-
            The part of the screen to return, with `view: region`. Rows and columns count from 0.
          properties:
            row:
              type: integer
            col:
              type: integer
            rows:
              type: integer
            cols:
              type: integer
          additionalProperties: false
      required:
        - name
      additionalProperties: false
- type: function
  function:
    name: shell_close
    description: |-
      End a terminal session. The program is asked to stop and killed if it does not. Prefer driving the program out itself, such as `:q!` in an editor, so that it can save or restore what it owns.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the session to end.
        force:
          type: boolean
          description: |-
            Kill the program at once instead of asking it to stop.
      required:
        - name
      additionalProperties: false
- type: function
  function:
    name: agent_input
    description: |-
      Answer a sub-agent that is running and waiting for input. You are told
      when one stops for input, with what it asked; this types the answer on
      its terminal, exactly as a person at that terminal would. A sub-agent
      that has finished is not typed into: call `agent` with its name to ask
      it something new.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            Name of the running sub-agent to answer.
        input:
          type: string
          description: |-
            The characters to send. Control characters work: use \u0003 for
            Ctrl-C and \u001b for escape.
        enter:
          type: boolean
          description: |-
            Append a carriage return, as a person pressing return would. True
            by default; set it to false to send raw keys.
      required:
        - name
        - input
      additionalProperties: false
- type: function
  function:
    name: ask_user
    description: |-
      Ask the user a question and wait for their answer. Use this when you need a decision or clarification only the user can give. Provide `options` to offer specific choices; the user may still answer freely. From a sub-agent the question goes to whoever delegated the work, who puts it to the user and sends the answer back.
    parameters:
      type: object
      properties:
        question:
          type: string
          description: |-
            The question to put to the user.
        options:
          type: array
          description: |-
            Optional list of suggested answers to present as a numbered menu.
          items:
            type: string
      required:
        - question
      additionalProperties: false
- type: function
  function:
    name: agent
    description: |-
      Delegate a self-contained sub-task to an autonomous sub-agent that runs its own tool-use loop in an isolated process and returns its final report. Use it for focused work you can describe completely up front (search, analysis, a multi-step edit); the sub-agent shares the workspace but not this conversation. Its final report comes back as the tool result and is not shown to the user - relay what matters. A sub-agent keeps its conversation under its name, so calling it again with that name goes back to the same one: ask it what it found, have it carry on, or give it the answer to something it asked. Its earlier work is still there and does not have to be repeated.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: |-
            A very short name for this sub-agent (at most 3 words). It is how you reach it: a new name starts a sub-agent, and a name you have used before goes back to that one, with everything it did still in its conversation. A sub-agent that is still running cannot be addressed - wait for its report.
        description:
          type: string
          description: |-
            A short (3-5 word) description of the delegated task, used as its label.
        task:
          type: string
          description: |-
            Complete, self-contained instructions for the sub-agent. For one you have called before, this is what you are asking it now; it remembers the rest.
        persona:
          type: string
          description: |-
            Optional named persona for the sub-agent, from the `agent/personas` configuration. A persona carries its own instructions and model settings. Omit it for the default sub-agent.
        context:
          type: string
          description: |-
            `fork` (the default) starts the sub-agent from this conversation, so it sees the context you already have; `fresh` starts it from the task alone, which is cheaper for self-contained work. It is read only when the sub-agent starts: one you are going back to keeps the conversation it has.
        timeout:
          type: integer
          description: |-
            Optional time limit in milliseconds. The sub-agent and every process it started are stopped when it expires.
      required:
        - name
        - description
        - task
      additionalProperties: false
- type: function
  function:
    name: time
    description: |-
      Report the current time. The system instructions are frozen when a conversation starts, so they cannot tell you what the time is now; ask for it when it matters, and to measure how long something took.
    parameters:
      type: object
      properties: {}
      additionalProperties: false
- type: function
  function:
    name: wait
    description: |-
      Wait for a while. Use it instead of a shell that sleeps: it starts no process and can be interrupted. Give `seconds`, or `until` for a wall-clock time. Name it to wait in the background: the call returns at once and you are told when it fires, so you can keep working meanwhile.
    parameters:
      type: object
      properties:
        seconds:
          type: number
          description: |-
            How long to wait, in seconds. A fraction is allowed.
        until:
          type: string
          description: |-
            Wall-clock time to wait for, as `HH:MM`, `HH:MM:SS` or a full `YYYY-MM-DDTHH:MM:SS` in local time. A time that has passed does not wait.
        name:
          type: string
          description: |-
            Name this wait to run it in the background instead of holding your turn. The call returns at once, and when the wait fires you are told, in a new turn, that it did. Use it to come back to something later: start a slow job, wait in the background, keep working, and pick it up when the wait fires. The name says what you are waiting for (letters, digits, '-' or '_'), and must be unique among the waits you have open.
        reason:
          type: string
          description: |-
            Optional short note on what this wait is for. It is shown to the user and given back to you when the wait fires.
      additionalProperties: false
