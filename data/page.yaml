# The live screen of the page renderer, as one document.
#
# fyai transcribes this document into UI Markdown for each frame, with the
# state of that frame. The document holds no expressions: `if` names a flag of
# the state, and fyai computes every flag. A node whose flag is not set is left
# out of the Markdown.
#
# A node is one of:
#   tight: true        blocks on adjacent rows from here on
#   slot: {id, rows}   rows that a component draws; no rows, no slot
#   row: [items]       one row of inline items
#   blank: true        one blank row
#   drop: N, body      blocks that go, in order, when the page is too tall
#   page: NAME         the nodes of a page of `pages`
#   markup: NAME       UI Markdown that fyai wrote, from the state
#   switch: NAME, cases   the case that the mode NAME of the state names;
#                      a case is {keys, body}, and its keys bind actions
#   each: NAME, body   the body for each item of the list NAME of the state,
#                      with the item, {index} and {number} in scope
#
# An inline item is one of:
#   text: "{a.b}"      text of the state, escaped
#   space: N           N blanks that the start of a row keeps
#   sgr: NAME          an SGR sequence of the theme, from the state
#   gutter: {mark, cols}  the mark of the state padded to the columns
#   role: {name, items}   items in a role of the palette
#   fill: {char}       the columns the row leaves, drawn with the glyph
#   markup: NAME       UI Markdown that fyai wrote, from the state
#   act: {action, arg, text}   a label that the user clicks for an action

# The layouts of the page, the first that the terminal is large enough for.
# A layout names its conditions (min_cols, min_rows) and where the pane
# stands: in a band of the page, or in a column of `cols` beside the
# transcript, each tile a panel of `tile_rows`. A side column needs the
# fullscreen page. A node can switch on layout.name.
layouts:
  - name: side
    min_cols: 170
    min_rows: 30
    pane: { place: side, cols: 82, tile_rows: 25 }
  - name: band
    pane: { place: band }

page:
  # The page stands inline under the scrollback, or takes the whole screen.
  - switch: screen.mode
    cases:
      inline:
        body:
          - page: inline
      fullscreen:
        body:
          # A popup of a result covers the whole screen until it closes.
          - switch: popup.mode
            cases:
              closed:
                body:
                  - page: fullscreen
              open:
                keys:
                  Escape: popup.close
                  Enter: popup.close
                  q: popup.close
                  Up: "popup.scroll:up"
                  Down: "popup.scroll:down"
                body:
                  - page: popup

pages:
  # Inline: the tail of the transcript, then the chrome.
  inline:
    - tight: true
    - if: tail.shown
      slot: { id: tail, rows: "{tail.rows}" }
    - if: pane.side
      markup: pane.grid_source
    - page: chrome

  # Fullscreen: committed rows and the live tail share one viewport.
  fullscreen:
    - tight: true
    # In a side layout the transcript stands in a grid beside the tiles.
    - if: transcript.shown
      slot: { id: transcript, rows: "{transcript.rows}" }
    - if: pane.side
      markup: pane.grid_source
    - page: chrome

  # The pane, the header, the input area and the status, in either screen.
  chrome:
    - if: pane.above
      page: pane

    # The header row under a blank row, which go before the rules when the
    # page is too tall.
    - if: header.shown
      drop: 2
      body:
        - blank: true
        # The canvas draws the header row, cut at the edge as the band stack
        # cuts it. A row of Markdown wraps a long header onto a second row.
        - slot: { id: header, rows: 1 }

    - page: input

    # A short result of a fullscreen session, until the user types.
    - if: note.shown
      slot: { id: note, rows: "{note.rows}" }

    # The hint or the completion ribbon, then the status.
    - if: status.shown
      drop: 1
      body:
        - if: status.completion
          slot: { id: completion, rows: 1 }
        - if: status.hint
          row:
            - sgr: status.on
            - text: "{status.hint_text}"
            - sgr: status.off
        # The row of the hint stands when it says nothing.
        - if: status.hint_blank
          blank: true
        - if: status.row
          row:
            - gutter: { mark: status.activity, cols: "{status.gutter}" }
            - sgr: status.on
            - markup: status.text
            - sgr: status.off

    - if: pane.below
      page: pane
  # The input area, in one mode at a time.
  input:
    - switch: input.mode
      cases:
        prompt:
          body:
            - page: prompt_box
        # A question while nothing is typed: the number keys choose.
        ask:
          keys:
            Up: ask.prev
            Down: ask.next
            Left: ask.back
            Right: ask.forward
            Space: ask.toggle
            Enter: ask.accept
            Escape: ask.dismiss
            "1": "ask.choose:1"
            "2": "ask.choose:2"
            "3": "ask.choose:3"
            "4": "ask.choose:4"
            "5": "ask.choose:5"
            "6": "ask.choose:6"
            "7": "ask.choose:7"
            "8": "ask.choose:8"
            "9": "ask.choose:9"
          body:
            - page: question
            - page: prompt_box
        # A question with an answer being typed: the number keys type.
        ask_text:
          keys:
            Up: ask.prev
            Down: ask.next
            Enter: ask.accept
            Escape: ask.dismiss
          body:
            - page: question
            - page: prompt_box

  # The prompt on its card, or between two rules.
  prompt_box:
    - if: prompt.card
      slot: { id: prompt, rows: "{prompt.card_rows}" }
    - if: prompt.rules
      page: rule
    - if: prompt.rules
      slot: { id: prompt, rows: "{prompt.rows}" }
    - if: prompt.rules
      page: rule

  # A question to the user: its header and text, who asks, each option with
  # its description, and the hint below. Many questions end in a review.
  question:
    - if: ask.question_shown
      row:
        - space: 2
        - sgr: header.on
        - text: "{ask.header}"
        - sgr: header.off
        - text: "  {ask.question}"
        - if: ask.progress_shown
          role:
            name: chrome
            items:
              - text: "  ({ask.progress})"
        - if: ask.waiting_shown
          text: "  ({ask.waiting} more)"
    - if: ask.review
      row:
        - space: 2
        - sgr: header.on
        - text: "Review"
        - sgr: header.off
        - text: "  Send these answers?"
    - if: ask.from_agent
      row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "asked by {ask.from}"
    - each: ask.options
      body:
        # The option under the cursor stands on the ground of the theme and
        # carries its bar, which its description shares.
        - if: selected
          row:
            - space: 2
            - role: { name: select.bar, items: [ { text: "{ask.bar}" } ] }
            - role:
                name: select.row
                items:
                  - space: 1
                  - act: { action: ask.choose, arg: "{number}", role: select.label, text: "{number}. {box}{text}" }
                  - fill: {}
        - if: other
          row:
            - space: 4
            - act: { action: ask.choose, arg: "{number}", role: select.label, text: "{number}. {box}{text}" }
        - if: selected_description
          row:
            - space: 2
            - role: { name: select.bar, items: [ { text: "{ask.bar}" } ] }
            - role:
                name: select.row
                items:
                  - space: 4
                  - role:
                      name: chrome
                      items:
                        - text: "{description}"
                  - fill: {}
        - if: other_description
          row:
            - space: 7
            - role:
                name: chrome
                items:
                  - text: "{description}"
    - if: ask.preview_shown
      row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "Preview \u00b7 {ask.preview_title}"
    - if: ask.preview_shown
      slot: { id: preview, rows: "{ask.preview_rows}" }
    - each: ask.lines
      body:
        - row:
            - space: 4
            - text: "{header}: {answer}"
    - row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "{ask.hint}"

  # The work pane: its cap row goes first when the page is too tall.
  pane:
    - blank: true
    - if: pane.cap
      drop: 0
      body:
        - row:
            - markup: pane.cap_source
    - if: pane.grid
      markup: pane.grid_source
    - if: pane.slot
      slot: { id: pane, rows: "{pane.rows}" }

  # The popup of a fullscreen session: its heading, then the result.
  popup:
    - tight: true
    - row:
        - role:
            name: chrome
            items:
              - text: "── {popup.title} "
        - act: { action: popup.close, text: "[Esc closes]" }
        - role:
            name: chrome
            items:
              - text: " "
              - fill: { char: "─" }
    - slot: { id: popup, rows: "{popup.rows}" }

  # A full-width rule in the chrome role, which goes last of the chrome.
  rule:
    - drop: 3
      body:
        - row:
            - role:
                name: chrome
                items:
                  - fill: { char: "─" }
