# The live screen of the page renderer, as one document.
#
# fyai transcribes this document into UI Markdown for each frame, with the
# state of that frame. The document holds no expressions: `if` names a flag of
# the state, and fyai computes every flag. A node whose flag is not set is left
# out of the Markdown.
#
# A node is one of:
#   tight: true        blocks on adjacent rows from here on
#   slot: {id, rows}   rows that a component draws; no rows, no slot
#   row: [items]       one row of inline items
#   blank: true        one blank row
#   drop: N, body      blocks that go, in order, when the page is too tall
#   page: NAME         the nodes of a page of `pages`
#   markup: NAME       UI Markdown that fyai wrote, from the state
#   switch: NAME, cases   the case that the mode NAME of the state names;
#                      a case is {keys, body}, and its keys bind actions
#   each: NAME, body   the body for each item of the list NAME of the state,
#                      with the item, {index} and {number} in scope
#   columns: {left_cols, left, right}   two bodies beside each other
#   panel: {id, type, source, rows}   a scroll view bound to source text
#   keys: {KEY: ACTION}   bindings while this part of the page is shown
#
# An inline item is one of:
#   text: "{a.b}"      text of the state, escaped
#   space: N           N blanks that the start of a row keeps
#   sgr: NAME          an SGR sequence of the theme, from the state
#   gutter: {mark, cols}  the mark of the state padded to the columns
#   role: {name, items}   items in a role of the palette
#   fill: {char}       the columns the row leaves, drawn with the glyph
#   markup: NAME       UI Markdown that fyai wrote, from the state
#   act: {action, arg, text}   a label that the user clicks for an action

# The layouts of the page, the first that the terminal is large enough for.
# A layout names its conditions (min_cols, min_rows) and where the pane
# stands: in a band of the page, or in a column of `cols` beside the
# transcript, each tile a panel of `tile_rows`. A side column needs the
# fullscreen page. A node can switch on layout.name.
layouts:
  - name: side
    min_cols: 170
    min_rows: 30
    pane: { place: side, cols: 82, tile_rows: 25 }
  - name: band
    pane: { place: band }

page:
  - page: session

pages:
  session:
    # The page stands inline under the scrollback, or takes the whole screen.
    - switch: screen.mode
      cases:
        inline:
          body:
            - page: inline
        fullscreen:
          body:
            # A popup of a result covers the whole screen until it closes.
            - switch: popup.mode
              cases:
                closed:
                  body:
                    - if: pane.normal
                      page: fullscreen
                    - if: pane.full
                      page: tile_full
                open:
                  keys:
                    Escape: popup.close
                    Enter: popup.close
                    q: popup.close
                    l: popup.level
                    x: popup.clear
                    Up: "popup.scroll:up"
                    Down: "popup.scroll:down"
                  body:
                    - page: popup

  # Inline: the tail of the transcript, then the chrome.
  inline:
    - tight: true
    - if: tail.shown
      slot: { id: tail, rows: "{tail.rows}" }
    - if: pane.side
      markup: pane.grid_source
    - page: chrome

  # Fullscreen: committed rows and the live tail share one viewport.
  fullscreen:
    - tight: true
    # In a side layout the transcript stands in a grid beside the tiles.
    - if: transcript.shown
      slot: { id: transcript, rows: "{transcript.rows}" }
    - if: pane.side
      markup: pane.grid_source
    - page: chrome

  # A maximized tile: the grid of the pane alone, then a hint row.
  tile_full:
    - tight: true
    - markup: pane.grid_source
    - row:
        - space: 2
        - role:
            name: chrome
            items:
              - text: "{glyphs.expand} or Ctrl-] returns to the page"

  # The pane, the header, the input area and the status, in either screen.
  chrome:
    - if: todo.shown
      drop: 0
      body:
        - page: todos
    - if: live.shown
      drop: 0
      body:
        - page: live
    - if: pane.above
      page: pane

    # The lines typed while a turn runs, on top of the input area: they
    # wait for the prompt under them.
    - if: pending.shown
      page: pending

    # The header row under a blank row, which go before the rules when the
    # page is too tall.
    - if: header.shown
      drop: 2
      body:
        - blank: true
        # The canvas draws the header row, cut at the edge as the band stack
        # cuts it. A row of Markdown wraps a long header onto a second row.
        - slot: { id: header, rows: 1 }

    - page: input

    # A short result of a fullscreen session, until the user types.
    - if: note.shown
      slot: { id: note, rows: "{note.rows}" }

    # The log of the session, small: a click on it expands it.
    - if: log.shown
      page: log_panel

    # The hint or the completion ribbon, then the status.
    - if: status.shown
      drop: 1
      body:
        - if: status.completion
          slot: { id: completion, rows: 1 }
        - if: status.hint
          row:
            - sgr: status.on
            - text: "{status.hint_text}"
            - sgr: status.off
        # The row of the hint stands when it says nothing.
        - if: status.hint_blank
          blank: true
        - if: status.row
          row:
            - gutter: { mark: status.activity, cols: "{status.gutter}" }
            - sgr: status.on
            - markup: status.text
            - sgr: status.off

    - if: pane.below
      page: pane
    - if: todo.below
      drop: 0
      body:
        - page: todos
    - if: live.below
      drop: 0
      body:
        - page: live
  # The input area, in one mode at a time.
  input:
    - switch: input.mode
      cases:
        prompt:
          body:
            - page: input_box
        # Reviews keep printable keys for the reply, including the first batch.
        ask:
          keys:
            Enter: ask.accept
            Escape: ask.dismiss
          body:
            - if: ask.no_diff
              keys:
                Up: ask.prev
                Down: ask.next
                Left: ask.back
                Right: ask.forward
                Space: ask.toggle
                "1": "ask.choose:1"
                "2": "ask.choose:2"
                "3": "ask.choose:3"
                "4": "ask.choose:4"
                "5": "ask.choose:5"
                "6": "ask.choose:6"
                "7": "ask.choose:7"
                "8": "ask.choose:8"
                "9": "ask.choose:9"
            - page: question
            - if: ask.no_diff
              page: input_box
        # A question with an answer being typed: the number keys type.
        ask_text:
          keys:
            Enter: ask.accept
            Escape: ask.dismiss
          body:
            - if: ask.no_diff
              keys:
                Up: ask.prev
                Down: ask.next
            - page: question
            - if: ask.no_diff
              page: input_box

  # The prompt on its card, or between two rules.
  input_box:
    - if: prompt.card
      slot: { id: prompt, rows: "{prompt.card_rows}" }
    - if: prompt.rules
      page: rule
    - if: prompt.rules
      slot: { id: prompt, rows: "{prompt.rows}" }
    - if: prompt.rules
      page: rule

  # A question to the user: its header and text, who asks, each option with
  # its description, and the hint below. Many questions end in a review.
  question:
    - if: ask.diff_shown
      page: ask_permissions
    - if: ask.no_diff
      page: ask_question

  ask_question:
    - page: question_heading
    - page: question_body

  ask_permissions:
    - keys:
        PageUp: "panel.scroll:permission-diff/page-up"
        PageDown: "panel.scroll:permission-diff/page-down"
    - switch: input.focus
      cases:
        "":
          body:
            - page: permission_choices_keys
        choices:
          body:
            - page: permission_choices_keys
        permission-diff:
          body:
            - keys:
                Left: page.focus:choices
                Up: panel.scroll:permission-diff/up
                Down: panel.scroll:permission-diff/down
                Tab: page.focus:prompt
                Shift-Tab: page.focus:choices
        prompt:
          body:
            - keys:
                Up: page.focus:choices
                Tab: page.focus:choices
                Shift-Tab: page.focus:permission-diff
    - page: question_heading
    - columns:
        left_cols: { fraction: 0.4 }
        left:
          - row:
              - space: 4
              - text: "Decision"
          - page: question_details
          - page: question_choices
          - row:
              - space: 4
              - act: { action: page.focus, arg: prompt, role: select.label, text: "Other: type a reply below" }
        right:
          - page: question_diff
    - row:
        - space: 2
        - text: "Your reply (optional)"
    - page: input_box

  permission_choices_keys:
    - keys:
        Up: ask.prev
        Down: ask.next:prompt
        Right: page.focus:permission-diff
        Tab: page.focus:permission-diff
        Shift-Tab: page.focus:prompt

  question_heading:
    - if: ask.question_shown
      row:
        - space: 2
        - sgr: header.on
        - text: "{ask.header}"
        - sgr: header.off
        - text: "  {ask.question}"
        - if: ask.progress_shown
          role:
            name: chrome
            items:
              - text: "  ({ask.progress})"
        - if: ask.waiting_shown
          text: "  ({ask.waiting} more)"
    - if: ask.review
      row:
        - space: 2
        - sgr: header.on
        - text: "Review"
        - sgr: header.off
        - text: "  Send these answers?"

  question_body:
    - page: question_choices
    - page: question_details

  question_choices:
    - if: ask.from_agent
      row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "asked by {ask.from}"
    - each: ask.options
      body:
        # The option under the cursor stands on the ground of the theme and
        # carries its bar, which its description shares.
        - if: selected
          row:
            - space: 2
            - role: { name: select.bar, items: [ { text: "{ask.bar}" } ] }
            - role:
                name: select.row
                items:
                  - space: 1
                  - act: { action: ask.choose, arg: "{number}", role: select.label, text: "{number}. {box}{text}" }
                  - fill: {}
        - if: other
          row:
            - space: 4
            - act: { action: ask.choose, arg: "{number}", role: select.label, text: "{number}. {box}{text}" }
        - if: selected_description
          row:
            - space: 2
            - role: { name: select.bar, items: [ { text: "{ask.bar}" } ] }
            - role:
                name: select.row
                items:
                  - space: 4
                  - role:
                      name: chrome
                      items:
                        - text: "{description}"
                  - fill: {}
        - if: other_description
          row:
            - space: 7
            - role:
                name: chrome
                items:
                  - text: "{description}"

  question_details:
    - if: ask.preview_option
      row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "Preview \u00b7 {ask.preview_title}"
    # A reviewed change: what the model wrote, then what fyai made. The
    # headings are fixed, so the proposal cannot pass for the diff.
    - if: ask.proposal_shown
      row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "Proposal \u00b7 written by the model"
    - if: ask.proposal_shown
      panel:
        id: permission-proposal
        focus: choices
        type: markdown
        source: ask.proposal
        rows: { content: true, min: 1, max: 10 }
    - if: ask.preview_option
      slot: { id: preview, rows: "{ask.preview_rows}" }
    - each: ask.lines
      body:
        - row:
            - space: 4
            - text: "{header}: {answer}"
    - row:
        - space: 4
        - role:
            name: chrome
            items:
              - if: ask.diff_shown
                text: "PgUp/PgDn scroll the diff \u00b7 "
              - text: "{ask.hint}"

  question_diff:
    - row:
        - space: 4
        - role:
            name: chrome
            items:
              - text: "Diff \u00b7 made by fyai"
    - panel:
        id: permission-diff
        type: diff
        source: ask.diff
        rows: { beside: 1, min: 3 }

  # The work pane: its cap row goes first when the page is too tall.
  pane:
    - blank: true
    - if: pane.cap
      drop: 0
      body:
        - row:
            - markup: pane.cap_source
    - if: pane.grid
      markup: pane.grid_source
    - if: pane.slot
      slot: { id: pane, rows: "{pane.rows}" }

  # The lines that wait for the prompt, under a blank row.
  pending:
    - blank: true
    - markup: pending.source

  # The todo list of the branch, above the prompt with the work pane.
  todos:
    - blank: true
    - row:
        - role:
            name: chrome
            items:
              - text: "Todos"
    - markup: todo.source

  # The live work under one blank row and no heading: the members that a
  # root session supervises, then the agents and the shells that have no
  # room. Each line says what it is.
  live:
    - blank: true
    - if: live.fleet
      markup: fleet.source
    - if: live.work
      markup: work.source

  # The compact log: its heading, then the newest results.
  log_panel:
    - keys:
        Escape: popup.hide
    - row:
        - role:
            name: chrome
            items:
              - text: "── "
        - act: { action: popup.expand, text: "{log.title}" }
        - role:
            name: chrome
            items:
              - text: " "
              - fill: { char: "─" }
              - text: " "
        - act: { action: popup.expand, text: "{glyphs.expand}" }
        - role:
            name: chrome
            items:
              - text: " "
        - act: { action: popup.hide, text: "{glyphs.close}" }
    - slot: { id: log, rows: "{log.rows}" }

  # The popup of a fullscreen session: its heading, then the result.
  popup:
    - tight: true
    - row:
        - role:
            name: chrome
            items:
              - text: "── {popup.title} "
        - act: { action: popup.close, text: "{glyphs.collapse}" }
        - role:
            name: chrome
            items:
              - text: " Esc collapses \u00b7 l level \u00b7 x clears"
        - role:
            name: chrome
            items:
              - text: " "
              - fill: { char: "─" }
    - slot: { id: popup, rows: "{popup.rows}" }

  # A full-width rule in the chrome role, which goes last of the chrome.
  rule:
    - drop: 3
      body:
        - row:
            - role:
                name: chrome
                items:
                  - fill: { char: "─" }
