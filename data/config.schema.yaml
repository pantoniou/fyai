# fyai configuration schema (JSON Schema 2020-12 subset).
# See doc/schema-validator-plan.md for supported validation keywords.
# The first sentence of each description is a completion hint (max 72 chars).
# Keep keys and defaults consistent with config.yaml.sample.
# Unknown keys are ignored by the loader, so most mappings permit additional
# properties. `x-fyai-scope: session` marks settings stored in the session
# layer; other settings are stored in the branch. Validation applies to each
# configuration commit and to `fyai config validate`.
type: object
description: >-
  Configuration settings for fyai. The document resides in an arena; see
  config.yaml.sample for the key list and defaults.
properties:
  view:
    type: object
    description: Configure project filesystem views.
    properties:
      durability:
        type: string
        enum: [lazy, durable]
        default: lazy
        description: >-
          Set the default persistence policy for new views. lazy skips backing
          filesystem flushes and may lose snapshots after power loss; durable
          flushes the backing filesystem before publishing snapshot references.
      scratch_dir:
        type: string
        default: ""
        description: >-
          Set the directory that a view replaces with a private tmpfs. An empty
          value selects $TMPDIR, else /tmp. The path must be absolute and exist,
          and must not lie inside the project.
      track_project:
        type: boolean
        default: false
        description: >-
          Record the state of the project with each ref-log entry that moves
          the head of a branch, when the arena is in the .fyai directory of the
          project. A reference to a point of a branch then names the files of
          that point: `view diff` takes it, and `reset` restores it. Each entry
          costs a scan of the project, and a state that did not change is
          shared with the entry before it. Linux only.
      tool_diff:
        type: boolean
        default: false
        x-fyai-scope: session
        description: >-
          Show what each group of tool calls changed in the project, as a diff
          under the calls, so a change that a shell command made is as visible
          as a patch. The project state is recorded before the turn and after
          each group of calls, with the paths that view/ignore and view/gitignore
          leave out left out. Each group costs a scan of the project. A call
          that can change files is followed: a patch, a file write, a shell, a
          terminal session, a sub-agent or a tool of a server. A patch and a
          file write then name their files and leave the change to this diff.
          The arena must be in the .fyai directory of the project. A session that runs in a view
          (view/isolate_session) shows them too. Linux only.
      undo_depth:
        type: integer
        minimum: 1
        default: 16
        x-fyai-scope: session
        description: >-
          Set how many groups of tool calls that view/tool_diff shows stay
          available to `/undo`. Each group holds two project states, so the
          depth limits the storage that a session keeps. The oldest group is
          dropped first.
      ignore:
        type: array
        items:
          type: string
        default: []
        description: >-
          List the paths that the user and the project do not see of a view. A
          view holds the whole project, build artifacts included, because the
          agent that works in it needs them; an ignored path is left out of
          its diff, its list of changes and its apply, and of the state that
          view/track_project and view/tool_diff record. Each entry is a line of
          a gitignore file: a trailing slash selects directories, a slash in
          the pattern anchors it to the project root, ! negates, and ** matches
          any number of directories. These rules outrank the .gitignore files.
      gitignore:
        type: boolean
        default: true
        description: >-
          Apply the .gitignore files of the project, and its .git/info/exclude,
          as view/ignore does, as `git status` leaves out what they name. The
          rules of view/ignore are applied first. The files are read from the
          project when a diff or an apply needs them. The global Git ignore file
          is not read. The .git directory is never ignored.
      isolate_session:
        type: boolean
        default: false
        description: >-
          Run each session and prompt in the view named session of the
          project. The invocation captures the project, runs again inside the
          view, and records the result. Its changes stay in the view until
          `view apply` writes them to the project. Linux only. It needs a
          writable arena and no credential isolation.
  auth:
    type: string
    enum: [auto, api-key, chatgpt]
    default: auto
    description: >-
      Select the credential method. auto preserves API-key precedence and uses
      a saved ChatGPT login for OpenAI Responses if no key is available; api-key
      and chatgpt force the selected method.
  model:
    x-fyai-complete: model
    type: string
    description: >-
      Select the model. The catalogue maps it to provider, endpoint, grammar,
      and wire ID. A `provider/` prefix pins a specific provider
      offering it (e.g. openrouter/glm-5.2). No default; falls back to a
      built-in model when unset.
  api:
    type: string
    enum: [responses, chat-completions, chat, messages]
    default: responses
    description: >-
      Select the provider API grammar. Valid grammars are responses,
      chat-completions, and messages; chat is an alias. The grammar is
      re-derived alongside api_url when `model` changes to a
      known catalogue entry.
  api_url:
    type: string
    description: >-
      Set the provider endpoint URL. It comes from the catalogue by default;
      set it only to override the endpoint resolved for the current
      model/api (e.g. a self-hosted mirror).
  api_key:
    type: object
    required: [type]
    description: >-
      Reference an API credential without storing its value. Raw api_key
      values are rejected on every ingestion path. Automatic lookup uses
      --api-key/-k, the provider's conventional <PROVIDER>_API_KEY
      environment variable, then its logical secret.
    properties:
      type:
        type: string
        enum: [auto, env, secret]
        description: Select automatic lookup, an environment variable, or a secret reference.
      value:
        type: string
        description: Name an environment variable or fyai secret. Omit for auto.
  system_prompt:
    type: string
    default: You are a concise assistant.
    description: Set the system prompt for each conversation.
  parallel_tool_calls_prompt:
    type: string
    default: >-
      Independent tool calls may be issued together in one response and will
      execute in parallel. Keep dependent or potentially conflicting tool
      calls in separate responses.
    description: >-
      Set guidance for parallel tool calls. It is appended to a new
      conversation's system prompt while parallel calls are enabled. An empty
      string suppresses the guidance without disabling parallel execution.
  parallel_tool_calls:
    type: boolean
    default: true
    description: >-
      Run independent built-in tool calls concurrently. Calls returned in
      one model response can run together.
  web_search:
    type: boolean
    default: true
    description: >-
      Enable the provider's hosted web-search tool. This is only
      available when the catalogue endpoint declares hosted web search.
  temperature:
    type: number
    minimum: 0
    maximum: 2
    default: 0
    description: Sampling temperature.
  max_tool_iterations:
    type: integer
    exclusiveMinimum: 0
    default: 1000
    description: >-
      Limit tool-call iterations per turn. On reaching the limit, the
      turn keeps the steps that completed and reports the limit as its cause.
  max_tokens:
    type: integer
    exclusiveMinimum: 0
    default: 8192
    description: >-
      Limit output tokens per model call. The Anthropic Messages API requires
      this value on every request; other APIs can use the catalogue limit.
  branch:
    type: object
    description: >-
      Configure branch conflict handling. Each branch has its own
      conversation and configuration.
    properties:
      on_conflict:
        type: string
        enum: [abort, rebase, merge]
        description: >-
          Select how to handle a concurrent change to this branch. `abort`
          writes nothing and reports the conflict; it is the default.
          `rebase` and `merge` replay this invocation's turns on top
          of the ones already committed; they agree here, because unpublished
          turns have no recorded time while committed ones already happened.
          Invocations on *different* branches never conflict.

  reasoning:
    type: object
    description: >-
      Configure reasoning for supported models. The setting maps to the
      Responses API `reasoning: { effort, summary }` and to Chat
      Completions `reasoning_effort` (summary is Responses-only). Default
      is unset (no reasoning requested) - there is no valid enum value for
      "off", so the whole key is normally absent rather than null.
    properties:
      effort:
        type: string
        enum: [minimal, low, medium, high]
        description: Set the reasoning effort for supported models.
      summary:
        type: string
        enum: [auto, concise, detailed]
        description: Set the reasoning summary detail for Responses requests.
  tools:
    type: boolean
    default: true
    description: Enable tool calling.
  builtin_shell:
    type: boolean
    default: false
    description: >-
      Use the provider's native shell tool. It replaces the `exec_command`
      function tool. Native calls use pipes and cannot request a terminal or
      keep a named session. The Messages API does not support native shell.
  retry:
    type: object
    additionalProperties: false
    description: >-
      Retry transient provider request failures. These include a refused or
      lost connection, a timeout, or HTTP 408, 429,
      500, 502, 503 or 504. The delay doubles after each attempt and includes
      jitter. A
      `Retry-After` header replaces the calculated delay.
    properties:
      max_attempts:
        type: integer
        minimum: 1
        default: 8
        description: >-
          Set the maximum attempts per request. The first attempt counts;
          1 disables retries. Rate limits may require several attempts.
      initial_delay_ms:
        type: integer
        minimum: 0
        default: 500
        description: Delay before the second attempt.
      max_delay_ms:
        type: integer
        minimum: 0
        default: 30000
        description: >-
          Limit the delay between retry attempts. This also caps a
          `Retry-After` value. 0 removes the bound.
  catalog_update:
    type: object
    additionalProperties: false
    description: >-
      Configure the catalogue update program.
    properties:
      command:
        type: string
        default: scrape-providers
        description: >-
          Set the catalogue update command. It must be compatible with
          scrape-providers. fyai adds --format yaml and selection options,
          runs it under /bin/sh with only the credentials named by
          `credentials`, and reads the catalogue from standard output.
      credentials:
        type: array
        maxItems: 32
        items:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        default:
          - ANTHROPIC_API_KEY
          - DEEPSEEK_API_KEY
          - FIREWORKS_API_KEY
          - META_API_KEY
          - OPENAI_API_KEY
          - OPENCODE_API_KEY
        description: >-
          List credential environment variables for catalogue updates. These
          hold provider keys for the command. Other credentials are removed
          from its environment.
      timeout_ms:
        type: integer
        minimum: 0
        default: 600000
        description: Limit one catalogue update run. 0 disables the limit.
  shell:
    type: object
    additionalProperties: false
    description: Configure shell-tool execution limits and defaults.
    properties:
      timeout_ms:
        type: integer
        minimum: 0
        default: 120000
        description: >-
          Set the default shell-tool time limit. It applies when the model
          requests no limit. The command stops when it expires; 0 disables it.
      max_timeout_ms:
        type: integer
        minimum: 0
        default: 600000
        description: >-
          Limit a shell timeout requested by the model. 0 removes the
          bound.
      max_output_tokens:
        type: integer
        minimum: 0
        default: 16384
        description: >-
          Limit tokens returned by one shell call. This applies when the
          model asks for none. Truncated output retains its end.
          0 disables the default limit.
      hard_max_output_tokens:
        type: integer
        minimum: 0
        default: 200000
        description: >-
          Limit shell output tokens requested by the model. 0 removes
          the bound.
      session_timeout_ms:
        type: integer
        minimum: 0
        default: 900000
        description: >-
          Limit idle time for a named terminal session. The session ends after
          this time with no read or write. It is not a limit on the program, which can
          work for as long as the model keeps using it. 0 removes the limit.
      tty_term:
        type: string
        default: xterm-256color
        description: Set the terminal type exposed to a `tty` shell call.
      input_poll_ms:
        type: integer
        minimum: 0
        default: 400
        description: >-
          Set the interval for checking terminal-session input waits. A program
          stopped in a read of its input needs the model,
          and the model is told so in a turn of its own. 0 does not ask.
      shell:
        type: string
        default: ""
        description: >-
          Set the default shell for a call. An empty value
          runs `/bin/sh`, as each other command of this program does.
      login:
        type: boolean
        default: false
        description: >-
          Use a login shell by default. It reads the user's profile when the
          call does not specify login behavior. A profile is where the tools
          and the environment of that user are set up.
      tty:
        type: boolean
        default: false
        description: >-
          Use a pseudo-terminal for shell calls by default. The native
          `shell_call` of the Responses grammar cannot ask,
          so this is the only way to give it a terminal.
      tty_rows:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Set pseudo-terminal rows for a `tty` shell call. 0 follows
          the real terminal, and gives 24 when there is none.
      tty_cols:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Set pseudo-terminal columns for a `tty` shell call. 0
          follows the real terminal, and gives 80 when there is none.
  read:
    type: object
    additionalProperties: false
    description: Configure read_file result limits.
    properties:
      max_bytes:
        type: integer
        minimum: 0
        default: 262144
        description: >-
          Limit default read_file result bytes. A larger file is
          truncated and the result reports the full size. 0 disables the
          default limit.
      hard_max_bytes:
        type: integer
        minimum: 0
        default: 4194304
        description: >-
          Limit read_file bytes requested by the model. 0 removes the
          bound.
  agent:
    type: object
    additionalProperties: false
    description: Configure sub-agent execution.
    properties:
      timeout_ms:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Set the default advisory sub-agent limit in milliseconds. It applies
          when neither the call nor the persona supplies a limit. Exceeding it
          does not stop the agent; 0 disables the advisory limit.
      max_timeout_ms:
        type: integer
        minimum: 0
        default: 3600000
        description: >-
          Limit a sub-agent timeout requested by the model. 0 removes the
          bound.
      hang_timeout_ms:
        type: integer
        minimum: 0
        default: 600000
        description: >-
          Set the sub-agent hang limit in milliseconds. It starts after the
          advisory limit, or at submission if that limit is disabled.
          0 disables termination.
      timeout_kill:
        type: boolean
        default: true
        description: >-
          Terminate a sub-agent after hang_timeout_ms. Disable this to report
          advisory overruns without terminating agents.
      isolation:
        type: string
        enum: [none, view]
        default: none
        description: >-
          Select where sub-agents run. none shares the project with the parent.
          view runs each sub-agent in a private view of the project: its
          changes stay in the view until the user applies them. The call can
          override this with the `isolated` parameter.
      personas:
        type: object
        description: >-
          Define named sub-agent personas. The `persona` parameter of the agent tool
          selects one by name. A key that a persona does not set keeps the
          value in force for the invocation.
        additionalProperties:
          type: object
          additionalProperties: false
          description: Configure one named sub-agent persona.
          properties:
            description:
              type: string
              description: >-
                Describe the purpose of this persona. This text is shown to the model with the
                list of names, thus it is what the model chooses on.
            system_prompt:
              type: string
              description: Set the instructions that define this persona.
            model:
              type: string
              description: >-
                Select a model for this persona. It is resolved through the catalogue like
                the top-level `model` key. It applies to fresh agents; forked
                agents always inherit the parent's resolved provider/model.
            temperature:
              type: number
              description: Set the sampling temperature for this persona.
            max_tokens:
              type: integer
              minimum: 1
              description: Limit output tokens per model call for this persona.
            thinking:
              type: boolean
              description: Display reasoning output of this sub-agent.
            timeout_ms:
              type: integer
              minimum: 0
              description: >-
                Set the time limit for this persona. It overrides agent/timeout_ms.
            context:
              type: string
              enum: [fork, fresh]
              description: >-
                Select the starting context for this persona. The `context`
                parameter of the call overrides it.
            reasoning:
              type: object
              additionalProperties: false
              description: Configure reasoning for this persona.
              properties:
                effort:
                  type: string
                  enum: [minimal, low, medium, high]
                  description: Set the reasoning effort for this persona.
                summary:
                  type: string
                  enum: [auto, concise, detailed]
                  description: Set the reasoning summary verbosity for this persona.
      spawn:
        type: string
        enum: [exec, fork]
        default: exec
        description: >-
          Select how a sub-agent child starts. `exec` runs fyai again, and the child
          receives the state of the parent on its control channel. `fork`
          continues the forked image of the parent. A transient run, a pinned
          root, and a platform without a supported executable-image path
          always use `fork`.
      transport_isolation:
        type: string
        enum: [none, auto, level-a, level-b]
        default: none
        description: >-
          Keep provider credentials out of every agent and tool process. A
          separate transport process holds the credentials and sends the
          requests of admitted agents. `none` keeps the credentials in the
          agents. `level-b` admits an agent by PID and pidfd only, which
          bounds no descendant, and is the only level that runs now.
          `level-a`, which adds a cgroup v2 subtree, is not built yet and
          stops the invocation. `auto` takes the highest level that runs
          and reports it, which is `level-b`. A level that the host cannot
          enforce stops the invocation. A change in a running session restarts it.
          Linux only. Experimental.
      max_branch_depth:
        type: integer
        minimum: 1
        default: 8
        description: >-
          Limit sub-agent branch nesting depth below the top-level branch. This counts branch path components, including ordinary
          branches, and protects the recursive branch allocator.
      max_live_agents:
        type: integer
        minimum: 1
        default: 16
        description: >-
          Limit concurrent agents in this invocation's complete
          descendant tree. The root grants admission before provider work
          starts. Excess calls fail so the caller can wait or change its task.
  sandbox:
    x-fyai-scope: session
    default: false
    description: >-
      Confine shell-tool executions with Landlock. This applies on Linux only;
      it has no effect elsewhere. `false` disables it; `true` or a mapping enables it -
      read-only system paths, read/write the project and temp dirs,
      everything else denied by default. Best-effort: the allow-list/prompt
      remains the portable floor when Landlock is unavailable.
    oneOf:
      - type: boolean
      - type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: Enable or disable the sandbox. A mapping defaults to enabled.
          deny:
            type: array
            description: >-
              Deny access to the specified paths. Paths can be project-relative,
              absolute, or home-relative. The .fyai arena is always denied.
            items:
              type: string
          allow:
            type: array
            description: Grant access to paths outside the project.
            items:
              anyOf:
                - type: string
                  description: Grant read and write access to this path.
                - type: object
                  required: [path]
                  properties:
                    path:
                      type: string
                      description: Name the path for this sandbox grant.
                    mode:
                      type: string
                      enum: [rw, ro, edit, append]
                      description: >-
                        Select the access mode for this path. rw is the default;
                        ro allows read and execute; edit modifies existing files
                        without create or delete; append writes without truncation.
          network:
            type: object
            description: >-
              Restrict network egress to listed TCP ports. Omit this mapping
              to leave egress open; an empty ports list denies all egress.
            properties:
              ports:
                type: array
                description: List TCP ports allowed for network egress.
                items:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: Set one allowed TCP port number.
  sandbox_profile:
    type: string
    enum: [normal, lockdown]
    default: normal
    description: >-
      Select the sandbox policy that confines shell-tool executions. `normal`
      uses `sandbox`. `lockdown` uses `sandbox_lockdown` and enables the sandbox
      whatever `sandbox` says. `/session lockdown` selects `lockdown` and
      `/session yolo` selects `normal`.
  sandbox_lockdown:
    type: object
    description: >-
      Set the sandbox policy of the `lockdown` profile, apart from `sandbox`.
      It is always enabled. A key that this mapping omits keeps its default: the
      secret locations of the platform are denied and network egress is denied.
      The `sandbox` mapping describes each key.
    properties:
      deny:
        type: array
        default: ["~/.ssh"]
        description: >-
          Deny access to the specified paths. Paths can be project-relative,
          absolute, or home-relative. The .fyai arena is always denied. A path
          that does not exist is left out.
        items:
          type: string
      allow:
        type: array
        description: Grant access to paths outside the project.
        items:
          anyOf:
            - type: string
              description: Grant read and write access to this path.
            - type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Name the path for this sandbox grant.
                mode:
                  type: string
                  enum: [rw, ro, edit, append]
                  description: >-
                    Select the access mode for this path. rw is the default;
                    ro allows read and execute; edit modifies existing files
                    without create or delete; append writes without truncation.
      network:
        type: object
        description: >-
          Restrict network egress to listed TCP ports. An empty ports list,
          the default, denies all egress. A kernel that cannot restrict egress
          leaves it open.
        properties:
          ports:
            type: array
            default: []
            description: List TCP ports allowed for network egress.
            items:
              type: integer
              minimum: 1
              maximum: 65535
              description: Set one allowed TCP port number.
  logprobs:
    type: boolean
    default: false
    description: Request token log-probabilities from the provider.
  top_logprobs:
    type: integer
    minimum: -1
    default: -1
    description: Set the number of top log-probability candidates per token. -1 leaves it unset.
  token_extents:
    x-fyai-scope: session
    type: boolean
    default: false
    description: Record streamed token extents in turn metadata.
  no_obfuscation:
    type: boolean
    default: false
    description: Disable provider-side response obfuscation where supported.
  whitewash_api_keys:
    type: boolean
    default: true
    description: Redact API keys from wire logs.
  response_chain:
    type: boolean
    default: false
    description: >-
      Chain Responses API requests with previous_response_id. This is off by default;
      a stale or evicted stored response automatically falls back to replaying
      the canonical local turn chain.
  no_auth:
    type: boolean
    default: false
    description: >-
      Skip API-key authentication for local model servers. This omits the
      Authorization and x-api-key headers for servers that use the Chat
      Completions wire format.
  arena_dir:
    type: string
    description: >-
      Set the .fyai arena location. By default, fyai finds it by walking up
      from the current working directory.
  logging:
    type: object
    description: Configure trace logs under .fyai/logs.
    properties:
      wire:
        type: boolean
        default: false
        description: Log raw provider request/response bodies.
      stream:
        type: boolean
        default: false
        description: Log streamed SSE events.
      conversation:
        type: boolean
        default: false
        description: Log the canonical conversation turns.
      mcp:
        type: boolean
        default: false
        description: Log MCP lifecycle and JSON-RPC request metadata.
      transport:
        type: boolean
        default: false
        description: >-
          Log the credential transport: admissions, rejected messages, request
          and response events, and its wire traffic. Credentials are always
          whited out; `whitewash_api_keys` does not apply to this log.
  display:
    x-fyai-scope: session
    type: object
    description: >-
      Configure output and terminal presentation. These options exist only
      in this nested group.
    properties:
      markdown:
        type: boolean
        default: true
        description: Render Markdown output.
      stream:
        type: boolean
        default: true
        description: Stream model responses as they arrive.
      recap_exchanges:
        type: integer
        minimum: -1
        default: -1
        description: >-
          Set how many exchanges to replay when an interactive
          session starts. -1 replays as many recent exchanges as the screen
          holds, 0 replays none.
      tool_preview_lines:
        type: integer
        minimum: 0
        default: 5
        description: Set the number of tool-result preview rows.
      tool_history_lines:
        type: integer
        minimum: 0
        default: 40
        description: >-
          Set how many rows of the output of a running tool call its tile
          keeps, which the scroll bar and the wheel move back through. The tile
          shows tool_preview_lines of them, and the stored exchange keeps the
          preview. A value that is not above tool_preview_lines keeps no
          history.
      tool_update_interval_ms:
        type: integer
        minimum: 0
        maximum: 1000
        default: 33
        description: >-
          Set the minimum interval between progressive tool-output redraws. Zero
          repaints every update.
      session_margin:
        type: string
        default: "  "
        description: >-
          Set the left gutter of terminal-session rows. It
          is as wide as the indicator of the title row, so the screen starts
          under the name of the call that opened it. An empty string draws
          none, and the screen then starts at the left edge of its tile.
      focus_bg:
        type: string
        default: theme
        description: >-
          Set the background of the focused input area. This applies to the
          prompt, pickers, and focused tiles. theme uses the palette's
          pane.focus role, or reverse video without a palette. reverse uses
          the terminal's text ground; #rrggbb sets an explicit colour. An
          empty value draws no ground and reverses the tile margin to mark
          focus. fyai reports an explicit colour if the theme text is hard
          to read on it.
      focus_mark:
        type: string
        enum: [wash, edge]
        default: edge
        description: >-
          Select how the input area that has the keys is marked. edge draws
          the edge column alone, and the ground stays that of the terminal.
          wash also draws focus_bg under it.
      focus_bg_mix:
        type: integer
        minimum: 0
        maximum: 100
        default: 35
        description: >-
          Set focus background mixing for program-coloured cells. 0 leaves the program's colours alone and 100 replaces them.
          Mixing needs a terminal that takes 24-bit colour and a colour to
          mix: a cell coloured from the terminal's own palette is left alone.
      work_layout:
        type: string
        enum: [auto, columns, stack, main-top, main-left]
        default: auto
        description: >-
          Select the work-pane tile layout. This controls how live shell-session
          and sub-agent screens share the pane.
          The tiles in a short final row share its full width.
          auto fits as many columns as keep every tile at work_min_tile_cols;
          columns uses work_columns; stack puts one screen above another;
          main-top gives the oldest screen the whole top
          row with the rest sharing the row beneath it; main-left gives it a
          column of its own with the rest stacked beside it.
      work_position:
        type: string
        enum: [above-prompt, below-prompt]
        default: above-prompt
        description: >-
          Select the position of the work pane. above-prompt makes it the last band above
          the prompt, next to the transcript the work came from. below-prompt
          takes the rows under the prompt and does not move the transcript
          when the pane grows.
      completion:
        type: string
        enum: [tab, auto]
        default: tab
        description: >-
          Select when the completion popup opens. tab opens it on Tab; auto
          opens it when the current input has candidates. A candidate still
          requires an explicit selection.
      command_output:
        type: string
        enum: [pane, transcript]
        default: pane
        description: >-
          Select where slash-command output appears. pane shows it in a popup or a
          tile, and the transcript keeps nothing of it. transcript draws the
          command and its output in the transcript, and stores both there.
      tool_display:
        type: string
        enum: [pane, inline]
        default: inline
        description: >-
          Select where the live output of a shell or agent call appears. pane
          shows it in a tile of the work pane. inline draws it in the
          transcript at the position of the call. An inline page draws it
          under the live tail until it is committed to the scrollback. A
          display without a page uses pane.
      inline_terminal_rows:
        type: integer
        minimum: 1
        default: 12
        description: >-
          Set the rows of a terminal that tool_display inline draws in the
          transcript.
      editor:
        type: string
        enum: [pane, terminal]
        default: pane
        description: >-
          Select where editors run. This applies to /edit, config edit, and log views. pane
          runs it in a tile of the work pane that takes the pane and the keys,
          and the session goes on when the editor ends. terminal gives the
          whole terminal to the editor, as a program outside fyai. A command
          without an interactive terminal UI always uses the terminal.
      work_columns:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Set tile columns when work_layout is columns. 0 keeps the automatic
          grid.
      page_layout:
        type: string
        minLength: 1
        default: auto
        x-fyai-complete: page-layout
        description: >-
          Select the layout of the page document by name. auto takes the first
          layout that the terminal is large enough for. A named layout is
          used at any size; a side layout still needs the fullscreen page and
          a column that leaves the transcript room, else auto chooses. The
          header templates show the layout in use as {layout}.
      work_panels:
        type: string
        enum: [auto, "on", "off"]
        default: auto
        description: >-
          Select when the pane is a column of panels beside the transcript.
          A side layout of the page document gives the column. auto uses
          the side layout when the terminal is as large as the document asks;
          on uses it at any size where the column fits; off keeps the pane in
          its band. A side layout needs the fullscreen page.
      work_panel_cols:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Set the width of the column of panels. 0 keeps the width of the page
          document. A column that leaves the transcript no room is not used.
      work_panel_rows:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Set the rows of each panel of the column. 0 keeps the rows of the
          page document.
      work_min_tile_cols:
        type: integer
        minimum: 0
        default: 40
        description: >-
          Set the minimum width of automatic-grid tiles. A terminal that cannot
          hold two of them shows one screen at a time.
      work_history_rows:
        type: integer
        minimum: 0
        default: 1000
        description: >-
          Set the number of scrollback rows kept for each tile. These rows left
          the top of the tile screen and remain available through
          its scroll bar and the wheel. 0 keeps none. A change applies to
          tiles that are open.
      work_open_delay_ms:
        type: integer
        minimum: 0
        default: 500
        description: >-
          Wait this many milliseconds before opening the work band for a shell
          call. A call that finishes sooner does not open a band. Zero opens it
          immediately.
      work_max_rows:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Limit the total height of the work pane. This includes its chrome and is a
          ceiling on work_zoom_rows, whichever of the two is smaller. 0 leaves
          the height to work_zoom_rows alone.
      work_zoom_rows:
        oneOf:
          - type: string
            enum: [full, half, quarter]
          - type: integer
            minimum: 1
        default: half
        description: >-
          Set the height of the work pane. full uses the available terminal height,
          half and quarter use that fraction of it, and an integer is a direct
          row limit. The first live tile opens at it, a fraction is recomputed
          after a terminal resize, and moving focus or zooming does not change
          it.
      work_frame:
        type: string
        default: none
        description: >-
          Set the chrome above and below the work pane. An empty string draws
          a rule; none removes it. Each tile already has a title row.
      work_cap:
        type: boolean
        default: false
        description: >-
          Show the work-pane cap row. It reports the height of the pane, how many
          tiles it holds, how many are shown, how many the layout hid, and the
          keys that move between them. It takes the place of work_frame above
          the pane, and it needs UI Markdown to draw its rule to the edge.
      tile_frame:
        type: string
        default: none
        description: >-
          Set the chrome below each tile. An empty string draws a rule; none
          removes it. The title row identifies the call.
      tile_sep:
        type: string
        default: " \u2503 "
        description: >-
          Set the rule between adjacent tile columns. It includes space that
          keeps the screens off it. It is what divides two programs; the
          session_margin gutter runs down the inside of one. An empty
          string draws none.
      page:
        type: string
        default: ""
        description: >-
          Set the YAML page document path. This configures the page renderer.
          An empty string uses the embedded data/page.yaml. When the page is
          made, the file is checked against the page schema and every case of
          it is transcribed. On validation failure, the session reports the
          cause and uses the embedded document. /page shows the document in
          use and the state, source and regions of the last frame.
      screen:
        type: string
        enum: [inline, fullscreen]
        default: fullscreen
        description: >-
          Select where the page renderer draws. inline keeps the transcript in the
          scrollback of the terminal. fullscreen takes the alternate screen: the
          transcript is a view of the page that the wheel, PageUp and PageDown
          scroll, and the terminal shows what it showed before when the session
          ends. It takes effect when the session starts.
      work_controls:
        type: string
        enum: [none, zoom, full]
        default: full
        description: >-
          Select tile mouse controls. none draws none. zoom ends the head of
          a tile in buttons that minimize, maximize and close it. full adds a
          scroll bar and its arrows, which, with the wheel over the tile,
          move its view back through the history of its program, or through
          the output of a running tool call. Anything
          but none grabs the mouse for the whole session, which takes
          selection and copy from the terminal. With the grab, a click on a
          tile gives it the keys and a click off the tiles gives them back to
          the prompt.
      tool_detail:
        x-fyai-scope: stored
        type: string
        enum: [none, brief, default, full]
        default: default
        description: >-
          Select how much tool output to show. none hides every body; brief bounds every
          body, default hides read/write bodies, bounds shell output, and
          shows patches fully; full shows every body.
      transcript_system:
        x-fyai-scope: stored
        type: boolean
        default: false
        description: Include system messages in transcript output.
      markdown_mode:
        type: string
        enum: [line, stream, oneshot]
        default: line
        description: >-
          Select the streamed Markdown rendering mode. This applies only when
          markdown and stream are enabled: line renders each line, stream
          redraws each chunk, and oneshot renders at the end.
      markdown_update_interval_ms:
        type: integer
        minimum: 0
        maximum: 1000
        default: 50
        description: >-
          Set the interval between streamed Markdown redraws. Zero repaints every update.
      color:
        type: string
        enum: [auto, off, on]
        default: auto
        description: Select output colour mode. auto uses colour for terminals; on forces colour even through a pipe.
      theme:
        x-fyai-scope: stored
        x-fyai-complete: theme
        type: string
        default: "ember:auto"
        description: >-
          Select the Markdown and terminal theme. A libfymd4c embedded theme
          can have an optional background variant,
          for example default:auto, catppuccin:dark, or solarized:light.
          The selected theme also controls fenced-code highlighting and
          terminal UI chrome. A libfypalette theme, such as ember:auto,
          styles the Markdown, the fenced code and the chrome from one
          palette. A build without libfypalette uses default:auto.
      theme_ground:
        type: string
        enum: [theme, terminal]
        default: theme
        description: >-
          Select the background used by a palette theme. theme uses the ground of
          the theme. terminal asks the terminal for its background and makes
          it the ground of the theme, so the neutral colours - the card,
          rules, faint, dim and ink text - keep their steps over the real
          background. The hue colours do not change. It applies when the
          background matches the variant of the theme, and needs a
          libfypalette that supports it.
          On a fullscreen page, theme fills default cell backgrounds with
          the palette's ground colour. Explicit content backgrounds stay
          unchanged. terminal leaves the page background to the terminal.
      table_border:
        type: string
        enum: [theme, grid, none]
        default: theme
        description: >-
          Select the table border style. theme follows the selected
          theme, grid forces borders, and none draws no border, independent of
          the selected Markdown theme.
      turn_separator:
        type: string
        default: ""
        description: >-
          Set the separator between transcript turns. It is rendered as themed
          Markdown in the
          transcript view. Empty, the default, is a blank line; "---" is a
          themed rule.
      tool_separator:
        type: string
        default: ""
        description: >-
          Set the separator before each tool result. It is rendered as themed Markdown.
          An empty value emits nothing.
      section_separator:
        type: string
        default: ""
        description: >-
          Set the separator between reasoning and the answer. Empty
          (default) is a blank line only.
      tool_group_fence:
        type: integer
        minimum: 0
        maximum: 8
        default: 1
        description: >-
          Set blank rows around each tool exchange. They appear in the live loop
          and in the transcript. A tool exchange is one group. It is not
          fenced against itself. 0 draws no blank row.
      user_card_fence:
        type: integer
        minimum: 0
        maximum: 8
        default: 1
        description: >-
          Set blank rows between a user card and its answer. The rows separate
          it. 0 puts the answer directly under the card.
      prompt:
        type: string
        default: "  > "
        description: >-
          Set the interactive prompt marker. Empty uses the built-in ("  > " with
          markdown, "> " otherwise). May carry SGR colour escapes.
      branch_view:
        type: string
        enum: [tree, gitgraph]
        default: tree
        description: Select the default branch browser view. tree uses libfymermaid; g toggles the open browser.
      branch_preview:
        type: string
        enum: [off, right, bottom, auto]
        default: auto
        description: >-
          Select where branch and resume browsers show a session preview.
          auto uses the right of a wide pane or the bottom of a tall one.
          Press p in either browser to cycle it for the session.
      branch_preview_size:
        type: integer
        minimum: 10
        maximum: 80
        default: 40
        description: Set the percentage of browser pane used for the session preview.
      branch_preview_width:
        oneOf:
          - type: string
            enum: [half, quarter]
          - type: string
            pattern: '^([1-7][0-9]|80)%$'
          - type: integer
            minimum: 28
            maximum: 1000
        description: >-
          Set the width of a right-side session preview. half, quarter, and a value
          ending in % use a share of the browser pane; an integer is an exact
          column count. When unset, branch_preview_size supplies the percentage.
      diagram_theme:
        type: string
        default: ""
        description: >-
          Select the libfymermaid theme. Empty selects its light or dark theme
          from the active display variant.
      diagram_charset:
        type: string
        enum: [auto, ascii, unicode, rich]
        default: auto
        description: Select the terminal diagram character set. auto follows the locale; rich is explicit.
      diagram_fit:
        type: string
        enum: [legend, shrink, clip]
        default: legend
        description: >-
          Select how diagrams fit their pane width. legend moves long gitgraph labels
          below the graph; other diagram types shrink their spacing where supported.
          The branch tree has fixed spacing and clips long rows.
      prompt_top:
        type: string
        default: " {location}"
        description: >-
          Set the top row of the interactive prompt. It is a {key} template over the
          session vars (model, provider, api, effort, summary, temp, ctx,
          tokens, cache, cost, branch, cwd, location, layout, isolation, view).
          Empty uses the built-in branch and working-directory row.
          A custom template replaces it. May carry SGR colour escapes. Add
          {isolation} to show the credential isolation here; the default
          bottom row already ends with it.
      prompt_bottom:
        type: string
        default: " {model} · {provider} · {api}{effort}{summary}{temp}{tokens}{cache}{cost}{isolation}{view}"
        description: >-
          Set the bottom status row of the prompt. It is a {key} template that
          replaces the built-in banner. Empty reproduces
          "{model} · {provider} · {api}{effort}{summary}{temp}{tokens}{cache}{cost}{isolation}{view}".
          {branch} is the invocation branch, {cwd} is its working directory,
          and {location} combines both. {layout} is the layout of the page
          in use. {isolation} is " · isolated LEVEL" while credential isolation
          is on, and empty otherwise; `/status` gives the detail. {view} is
          " · view session" while the session runs in a view
          (view/isolate_session), and empty otherwise. The default top row shows location;
          the bottom row retains model and usage information.
          {tokens} is the used and maximum context tokens with the percent,
          {cache} is the cached input tokens with the hit percent, and {cost}
          is the session cost. {ctx} keeps the short percent-only form. May
          carry SGR colour escapes.
      pretty:
        type: boolean
        default: false
        description: Format debug dumps as YAML.
      thinking:
        type: boolean
        default: true
        description: >-
          Display model reasoning output. Set false to suppress it in the
          live stream and transcript view.
      cache_info:
        type: boolean
        default: false
        description: Show provider cache information.
      stats:
        type: boolean
        default: false
        description: Show session token usage.
  model_info:
    type: object
    required: [name]
    description: >-
      Show catalogue metadata for the selected model. This read-only mapping
      is derived again on every commit; do not edit it. It contains the full
      models[] entry and canonical_provider.
    properties:
      name:
        type: string
        description: Show the canonical model ID from the catalogue.
      display_name:
        type: string
        description: Show the human-readable model name.
      context_window:
        type: integer
        description: Show the context window size in tokens.
      max_output_tokens:
        type: integer
        description: Show the maximum output tokens supported by the model.
      modalities:
        type: array
        description: List supported input and output modalities, such as text.
        items:
          type: string
      capabilities:
        type: array
        description: >-
          List model capabilities reported by the catalogue. Examples include
          tool_calling, json_mode, and reasoning.
        items:
          type: string
      open_source:
        type: boolean
        description: Show whether the model is open-weight.
      native_provider:
        type: string
        description: Show the originating provider when known.
      canonical_provider:
        type: string
        description: Show the model's default provider without a prefix.
      arena:
        type: object
        description: Show model ranking metadata when known.
        properties:
          rank:
            type: integer
            description: Show the model's rank.
          elo:
            type: number
            description: Show the model's Elo score.
          votes:
            type: integer
            description: Show the number of model ranking votes.

  mcp:
    type: object
    default: { enabled: false, startup_wait: true, endpoint: "", auth_token: { type: env, value: MCP_API_KEY }, protocol_version: "2024-11-05", servers: {}, timeout: 30 }
    description: >-
      Configure Model Context Protocol (MCP) connections. MCP is disabled by default;
      set enabled: true and configure endpoint (or servers) to connect.
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable MCP server connections.
      startup_wait:
        type: boolean
        default: true
        description: >-
          Wait for MCP servers before the first model step. This waits until every server has settled, so the
          initial turn sees the complete toolset. False submits optimistically
          with whatever tools are ready while servers keep connecting.
      endpoint:
        type: string
        default: ""
        description: Set the default MCP server URL.
      auth_token:
        type: object
        required: [type]
        description: >-
          Reference an MCP credential without storing its value.
        properties:
          type:
            type: string
            enum: [auto, env, secret]
            default: env
            description: Select the MCP credential reference type.
          value:
            type: string
            default: MCP_API_KEY
            description: Name the MCP credential environment variable or secret.
      protocol_version:
        type: string
        default: "2024-11-05"
        description: Set the MCP protocol version.
      servers:
        type: object
        default: {}
        description: >-
          Configure named MCP servers. HTTP servers may select OAuth with
          auth: { type: oauth }; without it, auth_token bearer behavior is
          preserved.
        additionalProperties:
          type: object
          description: Configure one named MCP server.
          properties:
            endpoint:
              type: string
              description: Set this MCP server's endpoint URL.
            auth:
              type: object
              description: Configure authentication for this MCP server.
              properties:
                type:
                  type: string
                  enum: [bearer, oauth]
                  description: Select bearer or OAuth authentication.
                allow_browser:
                  type: boolean
                  description: Permit browser-based OAuth authorization.
                scopes:
                  type: array
                  minItems: 1
                  description: List OAuth scopes to request.
                  items:
                    type: string
                    minLength: 1
                    description: Name one OAuth scope.
                authorization_params:
                  type: object
                  description: Set additional OAuth authorization parameters.
                client:
                  type: object
                  required: [id, redirect_uri]
                  description: Configure the OAuth client registration.
                  properties:
                    id:
                      type: string
                      minLength: 1
                      description: Set the OAuth client ID.
                    redirect_uri:
                      type: string
                      minLength: 1
                      description: Set the OAuth redirect URI.
                    token_endpoint_auth_method:
                      type: string
                      enum:
                        - none
                        - client_secret_post
                        - client_secret_basic
                      description: Select the OAuth token endpoint authentication method.
                    secret:
                      type: object
                      required: [type, value]
                      description: Reference the OAuth client secret.
                      properties:
                        type:
                          type: string
                          enum: [env, secret]
                          description: Select an environment or secret reference.
                        value:
                          type: string
                          minLength: 1
                          description: Name the environment variable or secret.
      timeout:
        type: integer
        default: 30
        exclusiveMinimum: 0
        description: Set the MCP request timeout in seconds.
