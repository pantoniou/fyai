# fyai configuration document schema (JSON Schema 2020-12 subset). The exact
# supported, ignored, and explicitly rejected keyword sets are documented in
# doc/schema-validator-plan.md.
# `description` is decorative only (not a validated keyword); kept in sync
# with config.yaml.sample, the authoritative source of the key list and
# their compiled-in defaults.
#
# Deliberately permissive at every level (additionalProperties left unset,
# i.e. true): this validates the shape/type/enum of keys fyai actually reads,
# not a closed vocabulary - an unknown key is silently ignored by the loader
# today, so rejecting it here would just be a second, divergent source of
# truth. Wired into the commit-time validation gate
# (config_validate_report_shallow in src/fyai_config.c), so every commit
# path (set/import/edit/--set) is checked against it; also available
# directly via `fyai config validate` and `fyai config schema`.
type: object
description: >-
  Top-level fyai config document (arena-resident; see config.yaml.sample).
properties:
  auth:
    type: string
    enum: [auto, api-key, chatgpt]
    default: auto
    description: >-
      Credential selection. auto preserves API-key precedence and otherwise
      uses a saved ChatGPT login for the OpenAI Responses provider; api-key
      and chatgpt force the selected method.
  model:
    type: string
    description: >-
      Selects the model; the catalogue maps it to provider/endpoint/grammar/
      wire-id. May carry a `provider/` prefix to pin a specific provider
      offering it (e.g. openrouter/glm-5.2). No default; falls back to a
      built-in model when unset.
  api:
    type: string
    enum: [responses, chat-completions, chat, messages]
    default: responses
    description: >-
      API grammar intent (not derived): responses | chat-completions |
      messages. Re-derived alongside api_url when `model` changes onto a
      known catalogue entry.
  api_url:
    type: string
    description: >-
      Endpoint URL. Derived from the catalogue by default; set explicitly
      only to override the endpoint the catalogue resolves for the current
      model/api (e.g. a self-hosted mirror).
  api_key:
    type: object
    required: [type]
    description: >-
      Non-secret pointer to the credential: never a raw value (raw
      api_key is rejected on every ingestion path). Falls back to
      --api-key/-k, then the provider's conventional
      <PROVIDER>_API_KEY environment variable.
    properties:
      type:
        type: string
        enum: [auto, env, secret]
        description: Automatic provider lookup, environment, or logical secret reference.
      value:
        type: string
        description: Environment variable or logical fyai secret name; omitted for auto.
  system_prompt:
    type: string
    default: You are a concise assistant.
    description: The system prompt prepended to every conversation.
  parallel_tool_calls_prompt:
    type: string
    default: >-
      Independent tool calls may be issued together in one response and will
      execute in parallel. Keep dependent or potentially conflicting tool
      calls in separate responses.
    description: >-
      Guidance appended to a new conversation's system prompt while parallel
      tool calls are enabled. Set to an empty string to suppress the guidance
      without disabling parallel execution.
  parallel_tool_calls:
    type: boolean
    default: true
    description: >-
      Allow independent built-in tool calls returned in one model response to
      execute concurrently.
  temperature:
    type: number
    minimum: 0
    maximum: 2
    default: 0
    description: Sampling temperature.
  max_tool_iterations:
    type: integer
    exclusiveMinimum: 0
    default: 1000
    description: >-
      Tool-call loop iteration cap per turn. It stops a runaway loop; the
      turn keeps the steps that completed and reports the limit as its cause.
  max_tokens:
    type: integer
    exclusiveMinimum: 0
    default: 8192
    description: >-
      Output-token cap per model call. Required by the Anthropic Messages
      API (sent on every request there); defaults from the catalogue
      otherwise.
  branch:
    type: object
    description: >-
      Branch behaviour. A branch is one independent line of work with its own
      conversation and its own configuration.
    properties:
      on_conflict:
        type: string
        enum: [abort, rebase, merge]
        description: >-
          What to do when another invocation advanced this branch while this
          one was running. `abort` writes nothing and reports it, which is the
          default because reordering a conversation unasked is the user's
          decision. `rebase` and `merge` replay this invocation's turns on top
          of the ones already committed; they agree here, because unpublished
          turns have no recorded time while committed ones already happened.
          Invocations on *different* branches never conflict.

  reasoning:
    type: object
    description: >-
      Reasoning/thinking effort for reasoning-capable models. Maps to the
      Responses API `reasoning: { effort, summary }` and to Chat
      Completions `reasoning_effort` (summary is Responses-only). Default
      is unset (no reasoning requested) - there is no valid enum value for
      "off", so the whole key is normally absent rather than null.
    properties:
      effort:
        type: string
        enum: [minimal, low, medium, high]
        description: Requested reasoning effort.
      summary:
        type: string
        enum: [auto, concise, detailed]
        description: Requested reasoning summary verbosity (Responses API only).
  tools:
    type: boolean
    default: true
    description: Enable tool calling.
  builtin_shell:
    type: boolean
    default: false
    description: >-
      Enable the OpenAI built-in shell tool in place of the `exec_command`
      function tool. It runs one command on pipes: it cannot ask for a
      terminal and it cannot keep a named session, so the session tools have
      nothing to attach to. Off by default, and forced off automatically for
      the Messages API grammar (which has no native shell tool support).
  retry:
    type: object
    additionalProperties: false
    description: >-
      Automatic retry of a provider request that failed for a transient
      reason: a refused or lost connection, a timeout, or HTTP 408, 429,
      500, 502, 503 or 504. The delay doubles after each attempt and keeps
      a random part, so parallel requests do not come back together. A
      `Retry-After` header replaces the calculated delay.
    properties:
      max_attempts:
        type: integer
        minimum: 1
        default: 8
        description: >-
          Attempts made for one request, the first one included. 1 disables
          retry. A token-per-minute limit can hold a request for most of a
          minute, which needs more attempts than a short outage does.
      initial_delay_ms:
        type: integer
        minimum: 0
        default: 500
        description: Delay before the second attempt.
      max_delay_ms:
        type: integer
        minimum: 0
        default: 30000
        description: >-
          Upper bound on one delay, applied to the calculated delay and to a
          `Retry-After` value. 0 removes the bound.
  shell:
    type: object
    additionalProperties: false
    description: Limits applied to shell-tool sub-executions.
    properties:
      timeout_ms:
        type: integer
        minimum: 0
        default: 120000
        description: >-
          Time limit applied when the model asks for none. The command is
          stopped when it expires. 0 disables the default limit.
      max_timeout_ms:
        type: integer
        minimum: 0
        default: 600000
        description: >-
          Upper bound on a `timeout` the model asks for. 0 removes the
          bound.
      max_output_tokens:
        type: integer
        minimum: 0
        default: 16384
        description: >-
          Token limit on the output one shell call returns, applied when the
          model asks for none. The end of the output is kept, because a
          command reports its conclusion last. 0 disables the default limit.
      hard_max_output_tokens:
        type: integer
        minimum: 0
        default: 200000
        description: >-
          Upper bound on a `max_output_tokens` the model asks for. 0 removes
          the bound.
      session_timeout_ms:
        type: integer
        minimum: 0
        default: 900000
        description: >-
          Idle limit of a named terminal session: the time with no read and no
          write before it is ended. It is not a limit on the program, which can
          work for as long as the model keeps using it. 0 removes the limit.
      tty_term:
        type: string
        default: xterm-256color
        description: Terminal type exposed to a `tty` shell call.
      input_poll_ms:
        type: integer
        minimum: 0
        default: 400
        description: >-
          How often a session is asked whether its program is waiting to be
          answered. A program stopped in a read of its input needs the model,
          and the model is told so in a turn of its own. 0 does not ask.
      shell:
        type: string
        default: ""
        description: >-
          The shell that a call runs under when the call names none. Empty
          runs `/bin/sh`, as each other command of this program does.
      login:
        type: boolean
        default: false
        description: >-
          Run a shell call under a login shell, which reads the profile of
          the user, when the call asks for none. A profile is where the tools
          and the environment of that user are set up.
      tty:
        type: boolean
        default: false
        description: >-
          Run a shell call on a pseudo-terminal when the call asks for
          none. The native `shell_call` of the Responses grammar cannot ask,
          so this is the only way to give it a terminal.
      tty_rows:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Rows of the pseudo-terminal given to a `tty` shell call. 0 follows
          the real terminal, and gives 24 when there is none.
      tty_cols:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Columns of the pseudo-terminal given to a `tty` shell call. 0
          follows the real terminal, and gives 80 when there is none.
  read:
    type: object
    additionalProperties: false
    description: Limits applied to read_file results.
    properties:
      max_bytes:
        type: integer
        minimum: 0
        default: 262144
        description: >-
          Byte limit applied when the model asks for none. A larger file is
          truncated and the result reports the full size. 0 disables the
          default limit.
      hard_max_bytes:
        type: integer
        minimum: 0
        default: 4194304
        description: >-
          Upper bound on a `max_bytes` the model asks for. 0 removes the
          bound.
  agent:
    type: object
    additionalProperties: false
    description: Sub-agent settings.
    properties:
      timeout_ms:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Time limit for one sub-agent job, in milliseconds. It applies when
          neither the call nor the persona asks for one. The job and every
          process below it are stopped when it expires. 0 removes the limit.
      max_timeout_ms:
        type: integer
        minimum: 0
        default: 3600000
        description: >-
          Upper bound on a `timeout` the model asks for. 0 removes the
          bound.
      personas:
        type: object
        description: >-
          Named sub-agent personas. The `persona` parameter of the agent tool
          selects one by name. A key that a persona does not set keeps the
          value in force for the invocation.
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            description:
              type: string
              description: >-
                What this persona is for. It is shown to the model with the
                list of names, thus it is what the model chooses on.
            system_prompt:
              type: string
              description: Instructions that define the persona.
            model:
              type: string
              description: >-
                Model for this persona, resolved through the catalogue like
                the top-level `model` key. It applies to fresh agents; forked
                agents always inherit the parent's resolved provider/model.
            temperature:
              type: number
            max_tokens:
              type: integer
              minimum: 1
            thinking:
              type: boolean
              description: Display reasoning output of the sub-agent.
            timeout_ms:
              type: integer
              minimum: 0
              description: >-
                Time limit for this persona, which overrides agent/timeout_ms.
            context:
              type: string
              enum: [fork, fresh]
              description: >-
                How a conversation of this persona starts. The `context`
                parameter of the call overrides it.
            reasoning:
              type: object
              additionalProperties: false
              properties:
                effort:
                  type: string
                  enum: [minimal, low, medium, high]
                summary:
                  type: string
                  enum: [auto, concise, detailed]
      max_branch_depth:
        type: integer
        minimum: 1
        default: 8
        description: >-
          Maximum nesting depth of sub-agent branches below a top-level
          branch. A sub-agent cannot delegate, thus one level is used now;
          the limit protects the branch allocator.
  sandbox:
    default: false
    description: >-
      Landlock-confine shell-tool sub-executions (Linux only; a no-op
      elsewhere). `false` disables it; `true` or a mapping enables it -
      read-only system paths, read/write the project and temp dirs,
      everything else denied by default. Best-effort: the allow-list/prompt
      remains the portable floor when Landlock is unavailable.
    oneOf:
      - type: boolean
      - type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: Turn the sandbox on/off (default true when this mapping is given).
          deny:
            type: array
            description: >-
              Paths carved out of the project grant (project-relative,
              absolute, or ~-relative). The .fyai arena is always denied.
            items:
              type: string
          allow:
            type: array
            description: Extra grants outside the project.
            items:
              anyOf:
                - type: string
                  description: A path, granted read/write (rw).
                - type: object
                  required: [path]
                  properties:
                    path:
                      type: string
                    mode:
                      type: string
                      enum: [rw, ro, edit, append]
                      description: >-
                        rw (default) | ro (read+execute only) | edit
                        (modify existing, no create/delete) | append
                        (write without truncating).
          network:
            type: object
            description: >-
              Present => restrict egress to the listed TCP ports; omit
              entirely to leave egress open; empty ports denies all
              egress.
            properties:
              ports:
                type: array
                items:
                  type: integer
                  minimum: 1
                  maximum: 65535
  logprobs:
    type: boolean
    default: false
    description: Request token log-probabilities.
  top_logprobs:
    type: integer
    minimum: -1
    default: -1
    description: Number of top log-probability candidates per token (-1 = unset).
  token_extents:
    type: boolean
    default: false
    description: Record streamed token extents in turn metadata.
  no_obfuscation:
    type: boolean
    default: false
    description: Disable provider-side response obfuscation, where supported.
  whitewash_api_keys:
    type: boolean
    default: true
    description: Redact API keys from wire logs.
  response_chain:
    type: boolean
    default: false
    description: >-
      Chain via previous_response_id (Responses API only). Off by default;
      a stale or evicted stored response automatically falls back to replaying
      the canonical local turn chain.
  no_auth:
    type: boolean
    default: false
    description: >-
      Skip the api_key requirement and the Authorization/x-api-key header,
      for local no-auth model servers (Ollama, llama.cpp's llama-server,
      vLLM, ...) speaking the Chat Completions wire format.
  arena_dir:
    type: string
    description: >-
      Pins a specific .fyai arena location. No default - computed at
      runtime by walking up from cwd.
  logging:
    type: object
    description: Trace logging under .fyai/logs.
    properties:
      wire:
        type: boolean
        default: false
        description: Log raw provider request/response bodies.
      stream:
        type: boolean
        default: false
        description: Log streamed SSE events.
      conversation:
        type: boolean
        default: false
        description: Log the canonical conversation turns.
      mcp:
        type: boolean
        default: false
        description: Log MCP lifecycle and JSON-RPC request metadata.
  display:
    type: object
    description: >-
      Stylistic/output options; the only supported form is this nested
      group (no top-level equivalents).
    properties:
      markdown:
        type: boolean
        default: true
        description: Render markdown output.
      stream:
        type: boolean
        default: true
        description: Stream the response as it arrives.
      recap_exchanges:
        type: integer
        minimum: -1
        default: -1
        description: >-
          Exchanges of conversation history replayed when an interactive
          session starts. -1 replays as many recent exchanges as the screen
          holds, 0 replays none.
      tool_preview_lines:
        type: integer
        minimum: 0
        default: 5
        description: Rendered rows of a tool result shown before it is bounded.
      tool_update_interval_ms:
        type: integer
        minimum: 0
        maximum: 1000
        default: 33
        description: >-
          Minimum interval between progressive tool-output redraws. Zero
          repaints every update.
      session_margin:
        type: string
        default: "  "
        description: >-
          The gutter drawn at the left of every row of a terminal session. It
          is as wide as the indicator of the title row, so the screen starts
          under the name of the call that opened it. An empty string draws
          none, and the screen then starts at the left edge of its tile.
      focus_bg:
        type: string
        default: reverse
        description: >-
          The ground of the tile that holds the keys: reverse for the ground
          the terminal draws text in, which contrasts on a light terminal and
          a dark one alike and asks for no colour the terminal may not have,
          or #rrggbb for one of your own. It is drawn
          under whatever the program draws: every cell that has no colour of
          its own takes it, the margin and the head with them, so focus needs
          no marker of its own, and the prompt stands on the same ground,
          because that is where the keys are when no tile holds them. An
          empty string draws no ground and marks focus by reversing the
          margin of the tile alone.
      focus_bg_mix:
        type: integer
        minimum: 0
        maximum: 100
        default: 35
        description: >-
          How much of focus_bg is mixed into a cell the program coloured
          itself. 0 leaves the program's colours alone and 100 replaces them.
          Mixing needs a terminal that takes 24-bit colour and a colour to
          mix: a cell coloured from the terminal's own palette is left alone.
      work_layout:
        type: string
        enum: [auto, columns, stack, main-top, main-left]
        default: auto
        description: >-
          How live shell-session and sub-agent screens share the work pane.
          No cell is left empty: the screens of a short last row share the
          columns it leaves, so three of them are two and a wide one.
          auto fits as many columns as keep every tile at work_min_tile_cols;
          columns uses work_columns; stack puts one screen above another, as
          separate bands did; main-top gives the oldest screen the whole top
          row with the rest sharing the row beneath it; main-left gives it a
          column of its own with the rest stacked beside it.
      work_position:
        type: string
        enum: [above-prompt, below-prompt]
        default: above-prompt
        description: >-
          Where the work pane stands. above-prompt makes it the last band above
          the prompt, next to the transcript the work came from. below-prompt
          takes the rows under the prompt instead, so the user types over the
          work and a pane that grows moves nothing that is being read.
      work_columns:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Columns of tiles when work_layout is columns. 0 keeps the automatic
          grid.
      work_min_tile_cols:
        type: integer
        minimum: 0
        default: 40
        description: >-
          The narrowest tile the automatic grid makes. A terminal that cannot
          hold two of them shows one screen at a time.
      work_max_rows:
        type: integer
        minimum: 0
        default: 0
        description: >-
          Rows the whole work pane may take, its own chrome included. It is a
          ceiling on work_zoom_rows, whichever of the two is smaller. 0 leaves
          the height to work_zoom_rows alone.
      work_zoom_rows:
        oneOf:
          - type: string
            enum: [full, half, quarter]
          - type: integer
            minimum: 1
        default: full
        description: >-
          Height of the work pane. full uses the available terminal height,
          half and quarter use that fraction of it, and an integer is a direct
          row limit. The first live tile opens at it, a fraction is recomputed
          after a terminal resize, and moving focus or zooming does not change
          it.
      work_frame:
        type: string
        default: none
        description: >-
          Chrome above and below the work pane. An empty string draws a rule;
          the word none removes it, which is the default because every tile
          already carries the title row of the call that opened it.
      tile_frame:
        type: string
        default: none
        description: >-
          Chrome below each tile, under the title row the call already draws.
          An empty string draws a rule; the word none removes it, which is
          the default because the pane already has a frame of its own.
      tile_sep:
        type: string
        default: " \u2503 "
        description: >-
          The rule between adjacent columns of tiles, with the space that
          keeps the screens off it. It is what divides two programs; the
          gutter session_margin draws runs down the inside of one. An empty
          string draws none.
      work_controls:
        type: string
        enum: [none, zoom, full]
        default: none
        description: >-
          Mouse affordances on a tile. none draws none. zoom draws the marks
          that zoom and close a tile. full adds a scroll bar and its arrows.
          Anything but none grabs the mouse for the whole session, which takes
          selection and copy from the terminal.
      tool_detail:
        type: string
        enum: [none, brief, default, full]
        default: default
        description: >-
          Tool presentation policy: none hides every body, brief bounds every
          body, default hides read/write bodies, bounds shell output, and
          shows patches fully; full shows every body.
      transcript_system:
        type: boolean
        default: false
        description: Include system messages in transcript output.
      markdown_mode:
        type: string
        enum: [line, stream, oneshot]
        default: line
        description: >-
          How streamed markdown is rendered (only with markdown + stream):
          line (per line) | stream (redraw per chunk) | oneshot (at end).
      markdown_update_interval_ms:
        type: integer
        minimum: 0
        maximum: 1000
        default: 50
        description: >-
          Minimum interval between progressive Markdown redraws in stream
          mode. Zero repaints every update.
      color:
        type: string
        enum: [auto, off, on]
        default: auto
        description: auto (colour iff a terminal) | off | on (force, even piped).
      theme:
        type: string
        default: "default:auto"
        description: >-
          libfymd4c embedded theme name with an optional background variant,
          for example default:auto, catppuccin:dark, or solarized:light.
          The selected theme also controls fenced-code highlighting and
          terminal UI chrome.
      table_border:
        type: string
        enum: [theme, grid, none]
        default: theme
        description: >-
          Override the theme's table border: theme (follow the selected
          theme), grid (force borders), or none (borderless), independent of
          the selected Markdown theme.
      turn_separator:
        type: string
        default: "---"
        description: >-
          Separator rendered (as markdown, themed) between turns in the
          transcript view. "---" is a themed rule; empty is a blank line.
      tool_separator:
        type: string
        default: ""
        description: >-
          Separator rendered (as markdown, themed) before each tool result,
          in both the live loop and transcript. Empty (default) emits nothing.
      section_separator:
        type: string
        default: ""
        description: >-
          Separator emitted between streamed reasoning and the answer. Empty
          (default) is a blank line only.
      prompt:
        type: string
        default: "  > "
        description: >-
          Interactive prompt marker. Empty uses the built-in ("  > " with
          markdown, "> " otherwise). May carry SGR colour escapes.
      prompt_top:
        type: string
        default: ""
        description: >-
          Top row of the interactive prompt bubble, a {key} template over the
          session vars (model, provider, api, effort, summary, temp, ctx,
          tokens, cache, cost).
          Empty is a blank styled row. May carry SGR colour escapes.
      prompt_bottom:
        type: string
        default: " {model} · {provider} · {api}{effort}{summary}{temp}{tokens}{cache}{cost}"
        description: >-
          Bottom status row of the prompt bubble, a {key} template that
          replaces the built-in banner. Empty reproduces
          "{model} · {provider} · {api}{effort}{summary}{temp}{tokens}{cache}{cost}".
          {tokens} is the used and maximum context tokens with the percent,
          {cache} is the cached input tokens with the hit percent, and {cost}
          is the session cost. {ctx} keeps the short percent-only form. May
          carry SGR colour escapes.
      pretty:
        type: boolean
        default: false
        description: Pretty (YAML) debug dumps.
      thinking:
        type: boolean
        default: true
        description: >-
          Display model reasoning/thinking output (streamed live to stderr
          and in the transcript view). Set false to suppress it.
      cache_info:
        type: boolean
        default: false
        description: Print provider cache info.
      stats:
        type: boolean
        default: false
        description: Print session token usage to stderr.
  catalog:
    type: object
    required: [name]
    description: >-
      Read-only, re-derived from the catalogue on every commit
      (catalog_sync_config_doc in src/fyai_config.c) - never hand-edit.
      The full models[] entry for the configured model plus
      canonical_provider.
    properties:
      name:
        type: string
        description: Catalogue canonical model id.
      display_name:
        type: string
        description: Human-readable model name.
      context_window:
        type: integer
        description: Total context window in tokens.
      max_output_tokens:
        type: integer
        description: Maximum output tokens the model supports.
      modalities:
        type: array
        description: Supported input/output modalities (e.g. text).
        items:
          type: string
      capabilities:
        type: array
        description: >-
          Capability flags in the catalogue controlled vocabulary (e.g.
          tool_calling, json_mode, reasoning).
        items:
          type: string
      open_source:
        type: boolean
        description: Whether the model is open-weight.
      native_provider:
        type: string
        description: The provider that originates the model, when relevant.
      canonical_provider:
        type: string
        description: The model's default, unprefixed provider.
      arena:
        type: object
        description: LMSYS/Chatbot Arena-style ranking metadata, when known.
        properties:
          rank:
            type: integer
          elo:
            type: number
          votes:
            type: integer

  mcp:
    type: object
    default: { enabled: false, startup_wait: true, endpoint: "", auth_token: { type: env, value: MCP_API_KEY }, protocol_version: "2024-11-05", servers: {}, timeout: 30 }
    description: >-
      Model Context Protocol (MCP) server connection. Disabled by default;
      set enabled: true and configure endpoint (or servers) to connect.
    properties:
      enabled:
        type: boolean
        default: false
        description: Turn MCP server connection on.
      startup_wait:
        type: boolean
        default: true
        description: >-
          Hold the first model step until every server has settled, so the
          initial turn sees the complete toolset. False submits optimistically
          with whatever tools are ready while servers keep connecting.
      endpoint:
        type: string
        default: ""
        description: Default MCP server URL.
      auth_token:
        type: object
        required: [type]
        description: >-
          Non-secret pointer to the MCP auth credential: never a raw value.
        properties:
          type:
            type: string
            enum: [auto, env, secret]
            default: env
          value:
            type: string
            default: MCP_API_KEY
      protocol_version:
        type: string
        default: "2024-11-05"
        description: MCP protocol version.
      servers:
        type: object
        default: {}
        description: >-
          Named server mappings. HTTP servers may select OAuth with
          auth: { type: oauth }; without it, auth_token bearer behavior is
          preserved.
        additionalProperties:
          type: object
          properties:
            endpoint:
              type: string
            auth:
              type: object
              properties:
                type:
                  type: string
                  enum: [bearer, oauth]
                allow_browser:
                  type: boolean
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                authorization_params:
                  type: object
                client:
                  type: object
                  required: [id, redirect_uri]
                  properties:
                    id:
                      type: string
                      minLength: 1
                    redirect_uri:
                      type: string
                      minLength: 1
                    token_endpoint_auth_method:
                      type: string
                      enum:
                        - none
                        - client_secret_post
                        - client_secret_basic
                    secret:
                      type: object
                      required: [type, value]
                      properties:
                        type:
                          type: string
                          enum: [env, secret]
                        value:
                          type: string
                          minLength: 1
      timeout:
        type: integer
        default: 30
        exclusiveMinimum: 0
        description: Request timeout in seconds.
