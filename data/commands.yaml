# SPDX-License-Identifier: MIT
#
# Command definitions: one source for the parser, validation, completion, and
# help of a verb (`fyai branch new x`) and a slash command (`/branch new x`).
# data/command.schema.yaml describes this document; doc/command-schema-plan.md
# describes the design.
#
# A command has either `commands` (a group) or a `handler`. `arguments` is a
# JSON Schema of the argument mapping; the x-fyai-* keywords bind each
# property to the command line.

global:
  title: options of every invocation
  description: |
    Global options go before the verb. With no verb, the remaining arguments
    are the prompt; with no arguments, fyai starts an interactive session.
  arguments:
    type: object
    properties:
      help:
        type: boolean
        description: show the help, as fyai help does with the words that follow
        x-fyai-short: h
      version:
        type: boolean
        description: print the fyai version
      config:
        type: string
        description: load an explicit configuration file
        x-fyai-short: C
        x-fyai-meta: FILE
        x-fyai-complete: file
      env:
        type: string
        description: source a .env file (only the variables that are used)
        x-fyai-short: e
        x-fyai-meta: FILE
        x-fyai-complete: file
      model:
        type: string
        description: model, optionally as provider/model
        x-fyai-short: m
        x-fyai-meta: MODEL
        x-fyai-complete: model
      branch:
        type: string
        description: work on this branch (else $FYAI_BRANCH, else HEAD)
        x-fyai-short: b
        x-fyai-meta: BRANCH
        x-fyai-complete: branch
      root:
        type: string
        description: read one exact state by root handle (read-only)
        x-fyai-meta: HANDLE
      set:
        type: array
        items: {type: string}
        description: set a configuration key for this run and store it
        x-fyai-repeat: true
        x-fyai-meta: KEY=VALUE
        x-fyai-complete: config-assign
      get:
        type: string
        description: print a configuration key as one-line flow
        x-fyai-meta: KEY
        x-fyai-complete: config-path
      delete:
        type: array
        items: {type: string}
        description: delete a configuration key
        x-fyai-repeat: true
        x-fyai-meta: KEY
        x-fyai-complete: config-path
      transient:
        type: boolean
        description: keep the edits and the state of this run in memory only
      api-key:
        type: string
        description: API key (else the PROVIDER_API_KEY variable)
        x-fyai-short: k
        x-fyai-meta: KEY
      new:
        type: boolean
        description: start a new conversation
      sandbox:
        type: boolean
        description: confine shell tools with Landlock (Linux)
      color:
        type: string
        enum: [auto, "off", "on"]
        description: colour output
      theme:
        type: string
        description: Markdown theme
        x-fyai-meta: THEME
        x-fyai-complete: theme
      interactive:
        type: boolean
        description: interactive prompt loop
        x-fyai-short: i
      answer:
        type: array
        items: {type: string}
        description: supply an ask_user answer in advance
        x-fyai-repeat: true
        x-fyai-meta: TEXT
      debug:
        type: boolean
        description: increase the debug verbosity
        x-fyai-short: d

topics:
  - topic: refs
    title: the reference syntax
    description: |
      A reference names one stored state of a branch. Only symbolic
      references exist:

      - `<branch>`: the head of the branch. `HEAD` names the current branch.
      - `<branch>~N`: N stored turns before the head. One exchange of a user
        and the assistant is normally two turns.
      - `<branch>^`, `<branch>^^`: one caret for each turn back.
      - `<branch>@{N}`: the Nth earlier entry of the ref log of the branch.
        `<branch>@{1}` is the state before the last change.

      A branch name is slash-separated: `feature/x` is below `feature`.
      Names that start with `session/` are interactive sessions; a name that
      holds `agent:` is the conversation of a sub-agent.
  - topic: config-paths
    title: configuration paths and values
    description: |
      A configuration path is a slash-separated list of keys, such as
      `display/theme` or `reasoning/effort`. A value is a YAML flow
      document: `on`, `42`, `'a string'`, `[a, b]`, `{k: v}`.

      `data/config.schema.yaml` defines the keys and their types;
      `fyai config describe [PATH]` shows them.
  - topic: api-key
    title: how an API key is configured
    description: |
      fyai never stores a raw API key. The `api_key` setting names the
      environment variable that holds the key:

          api_key: {type: env, value: OPENAI_API_KEY}

      Without a setting, fyai reads `<PROVIDER>_API_KEY`. `--api-key` gives
      a key for one invocation only.
  - topic: output
    title: machine-readable output
    description: |
      Each verb that is defined in the command registry accepts
      `--output FORMAT`. `markdown`, the default, renders the result.
      `json` writes it as one compact JSON document, and `yaml` as a YAML
      document. A command that streams writes one document for each item:
      JSON Lines, or a YAML stream.
  - topic: completion
    title: shell completion
    description: |
      `fyai completion bash`, `zsh`, or `fish` writes a script that
      completes fyai in that shell. Load it from the start-up file:

          source <(fyai completion bash)      # ~/.bashrc
          source <(fyai completion zsh)       # ~/.zshrc
          fyai completion fish | source       # config.fish

      The script asks `fyai __complete` for the candidates, so branches,
      models, and configuration paths come from the arena.

commands:
  - command: help
    title: describe commands and topics
    description: |
      With no argument, list the commands. With a command path, describe
      that command. With a topic name, show the topic.
    surfaces: [cli, session]
    handler: help
    mode: result
    flags: [no-storage]
    view: true
    while_busy: run
    examples:
      - args: help branch new
        text: describe the command that creates a branch
      - args: help refs
        text: explain the reference syntax
    arguments:
      type: object
      additionalProperties: false
      properties:
        topic:
          type: array
          items: {type: string}
          description: a command path or a topic name
          x-fyai-positional: 0
          x-fyai-meta: TOPIC
          x-fyai-complete: help-topic
        markdown:
          type: boolean
          description: write the whole reference as Markdown
          x-fyai-surfaces: [cli]
        man:
          type: boolean
          description: write the whole reference as the manual page fyai(1)
          x-fyai-surfaces: [cli]

  - command: render
    title: render Markdown in the terminal
    description: |
      Read Markdown from a file, or from standard input when no file is
      given or the file is `-`, and write it with the renderer of fyai: the
      theme, the tables, the fenced code, and the `mermaid` diagrams of the
      display configuration. With `display/markdown` off, the source is
      written as it is.
    surfaces: [cli]
    handler: render
    flags: [no-storage]
    examples:
      - args: render README.md
        text: show a file as the conversation shows an answer
      - args: render - <<< '# Title'
        text: render Markdown from standard input
    arguments:
      type: object
      additionalProperties: false
      properties:
        file:
          type: string
          description: the Markdown file (default standard input)
          x-fyai-positional: 0
          x-fyai-meta: FILE
          x-fyai-complete: file

  - command: branch
    title: list, create, and manage branches
    description: |
      A branch holds one conversation and the configuration that goes with
      it. See `help refs` for the reference syntax.
    surfaces: [cli, session]
    default: list
    fallback: {cli: list, session: switch}
    see_also: [checkout, refs]
    commands:
      - command: list
        title: list the branches
        description: |
          List the branches. With a name, list only the branches below it.
          Sub-agent branches are hidden unless `--all` is given.
        handler: branch_list
        flags: [transient]
        view: true
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            under:
              type: string
              description: list only the branches below this name
              x-fyai-positional: 0
              x-fyai-meta: BRANCH
              x-fyai-complete: branch
            all:
              type: boolean
              description: include sub-agent branches
              x-fyai-short: a
        render:
          table:
            title: Branches
            empty: no branches
            keys: [current, branch, turns, model, updated, description]
            columns:
              current: {name: "*", format: mark}
              branch: {name: Branch, align: left}
              turns: {name: Turns}
              model: {name: Model, align: left}
              updated: {name: Updated, align: left, format: time}
              description: {name: Description, align: left}

      - command: new
        aliases: [create]
        title: create a branch
        description: |
          Create a branch at a reference. The new branch takes the
          conversation and the configuration of that reference. In a
          session, the session then switches to the new branch.
        handler: branch_new
        examples:
          - args: branch new feature main~2
            text: start a branch two turns before the head of main
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: name of the new branch
              x-fyai-positional: 0
              x-fyai-meta: NAME
            ref:
              type: string
              description: start point (default the current head)
              x-fyai-positional: 1
              x-fyai-meta: REF
              x-fyai-complete: ref
        render:
          message:
            - "created branch {branch}"
            - "switched to branch {switched}"

      - command: delete
        aliases: [rm]
        title: delete a branch
        description: |
          Delete a branch. The current branch cannot be deleted. A branch
          with branches below it needs `--force`.
        handler: branch_delete
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the branch to delete
              x-fyai-positional: 0
              x-fyai-meta: BRANCH
              x-fyai-complete: branch
            force:
              type: boolean
              description: also delete a branch that has branches below it
              x-fyai-short: f
        render:
          message: "deleted branch {branch}"

      - command: rename
        aliases: [mv]
        title: rename a branch
        description: Give a branch a new name. Its ref log goes with it.
        handler: branch_rename
        arguments:
          type: object
          required: [name, new_name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the branch to rename
              x-fyai-positional: 0
              x-fyai-meta: BRANCH
              x-fyai-complete: branch
            new_name:
              type: string
              minLength: 1
              description: the new name
              x-fyai-positional: 1
              x-fyai-meta: NEW
        render:
          message: "renamed {from} to {to}"

      - command: show
        title: show the details of a branch
        description: Show the details of a branch, by default the current one.
        handler: branch_show
        flags: [transient]
        view: true
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: the branch (default the current branch)
              x-fyai-positional: 0
              x-fyai-meta: BRANCH
              x-fyai-complete: branch
        render:
          table:
            title: Branch
            key_header: Field
            value_header: Value
            columns:
              created: {format: time}
              updated: {format: time}

      - command: describe
        title: set the description of a branch
        description: |
          Set the description of a branch. With no text, remove it.
        handler: branch_describe
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the branch
              x-fyai-positional: 0
              x-fyai-meta: BRANCH
              x-fyai-complete: branch
            text:
              type: string
              description: the description
              x-fyai-positional: 1
              x-fyai-rest: true
              x-fyai-meta: TEXT
        render:
          message: "described branch {branch}"

      - command: switch
        title: switch the session to a branch
        description: |
          Switch the session to a branch, and create the branch when it does
          not exist. The conversation and the configuration of the branch
          replace those of the session. `/branch NAME` is the same command.
        surfaces: [session]
        handler: branch_switch
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the branch
              x-fyai-positional: 0
              x-fyai-meta: BRANCH
              x-fyai-complete: branch
        render:
          message:
            - "created branch {created}"
            - "switched to branch {branch}"

      - command: attach
        title: show the screen of a live sub-agent
        description: Give the tile of a running sub-agent the pane and the keys.
        surfaces: [session]
        handler: branch_attach
        while_busy: run
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the branch of the sub-agent
              x-fyai-positional: 0
              x-fyai-meta: AGENT
              x-fyai-complete: agent-branch

      - command: detach
        title: leave the screen of a sub-agent
        description: Return the keys from an attached sub-agent to the prompt.
        surfaces: [session]
        handler: branch_detach
        while_busy: run
        arguments:
          type: object
          additionalProperties: false

  - command: checkout
    title: switch to a branch or fork a reference
    description: |
      Select a branch and move the stored `HEAD` to it. With `-b`, create
      the branch first, at START or at the current head.

      In a session, a reference to an earlier state (`main~2`,
      `main@{1}`) is not moved: the session starts a new `session/` branch
      at that state and switches to it.
    surfaces: [cli, session]
    handler: checkout
    see_also: [branch, refs]
    examples:
      - args: checkout -b fix main@{1}
        text: create the branch fix at the state before the last change
    arguments:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        create:
          type: boolean
          description: create the branch TARGET first
          x-fyai-short: b
          x-fyai-long: create
        target:
          type: string
          minLength: 1
          description: the branch, or a reference in a session
          x-fyai-positional: 0
          x-fyai-meta: BRANCH
          x-fyai-complete: ref
        start:
          type: string
          description: the start point of a branch that -b creates
          x-fyai-positional: 1
          x-fyai-meta: START
          x-fyai-complete: ref
    render:
      message:
        - "created branch {created}"
        - "switched to branch {branch}"

  - command: model
    title: show or select the model
    description: |
      With no name, show the model, its provider, the API grammar, and the
      context window. With a name, select that model and store it in the
      configuration of the branch. `provider/model` selects the offering of
      one provider.
    surfaces: [cli, session]
    handler: model
    while_busy: bare
    see_also: [config-paths]
    arguments:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: the model to select
          x-fyai-positional: 0
          x-fyai-meta: MODEL
          x-fyai-complete: model
    render:
      message: "model: {model} (provider {provider}, api {api})"

  - command: init
    title: create the arena in this directory
    description: |
      Create ./.fyai/arena/ and publish its first root. FILE, or
      config.yaml when it exists, is stored as the configuration; `--force`
      stores it over an existing configuration.
    surfaces: [cli]
    handler: init
    prepare: init
    flags: [no-storage]
    arguments:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          description: store the configuration over an existing one
          x-fyai-short: f
        file:
          type: string
          description: the configuration file
          x-fyai-positional: 0
          x-fyai-meta: FILE
          x-fyai-complete: file

  - command: dump
    title: write the stored conversation as YAML
    description: |
      Write the stored conversation as YAML: `state`, the canonical and
      provider-independent conversation; `anchors`, the whole turn graph;
      or `providers`, the wire streams of each turn. `--first`, `--last`,
      and `--range` select turns (from 0, inclusive).
    surfaces: [cli]
    handler: dump
    flags: [transient]
    arguments:
      type: object
      additionalProperties: false
      properties:
        what:
          type: string
          enum: [state, anchors, providers]
          default: state
          description: what to write
          x-fyai-positional: 0
          x-fyai-meta: WHAT
        first:
          type: integer
          minimum: 0
          description: the first N turns
          x-fyai-meta: N
        last:
          type: integer
          minimum: 0
          description: the last N turns
          x-fyai-meta: N
        range:
          type: string
          pattern: "^[0-9]+[,:][0-9]+$"
          description: the turns A to B
          x-fyai-meta: A,B
        decorate:
          type: boolean
          description: add comments that name each part

  - command: import
    title: read a conversation into the branch
    description: |
      Read a textual export from standard input or `--input`, and replay its
      publish boundaries into the branch. `--branch` selects an empty
      destination. Compaction markers make provider requests;
      `--ignore-compact` skips them.

      `--from` reads the sessions of another program: `auto`,
      `claude-code`, or `codex`. `--list` finds its sessions (`--all` in
      every directory), `--session ID` imports one, and `--dry-run` checks a
      file without storing it. `--source-root` names the state directory of
      a concrete source.
    surfaces: [cli]
    handler: import
    flags: [transient]
    see_also: [export]
    arguments:
      type: object
      additionalProperties: false
      properties:
        input:
          type: string
          description: the input file (default standard input)
          x-fyai-short: i
          x-fyai-meta: FILE
          x-fyai-complete: file
        ignore_compact:
          type: boolean
          description: skip the compaction markers
        from:
          type: string
          enum: [fyai, auto, claude-code, codex]
          description: the program that wrote the input
          x-fyai-meta: SOURCE
        source_root:
          type: string
          description: the state directory of the source
          x-fyai-meta: DIR
          x-fyai-complete: dir
        session:
          type: string
          description: the ID of the session to import
          x-fyai-meta: ID
        dry_run:
          type: boolean
          description: check the input and store nothing
        list:
          type: boolean
          description: list the sessions of the source
        all:
          type: boolean
          description: list the sessions of every directory
        json:
          type: boolean
          description: write the list or the check as JSON

  - command: replay
    title: send the user turns of the branch again
    description: |
      Send the user turns of the branch again, against the configuration
      and the tools as they are now.
    surfaces: [cli]
    handler: replay
    flags: [model]
    arguments:
      type: object
      additionalProperties: false
      properties:
        ignore_compact:
          type: boolean
          description: skip the compaction markers

  - command: tool
    title: run one built-in tool
    description: |
      Run one built-in tool, such as `shell` or `read_file`, in a sandboxed
      child and write its result. JSON is the object of arguments; without
      it, the object is read from standard input.
    surfaces: [cli]
    handler: tool
    arguments:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: the tool
          x-fyai-positional: 0
          x-fyai-meta: NAME
        json:
          type: string
          description: the arguments, as a JSON object
          x-fyai-positional: 1
          x-fyai-rest: true
          x-fyai-meta: JSON

  - command: term
    title: run a terminal that fyai draws
    description: |
      Run a shell, or COMMAND, in a full-screen terminal that fyai draws.
      `^\ q` leaves it.
    surfaces: [cli]
    handler: term
    prepare: term
    flags: [no-storage, interactive]
    arguments:
      type: object
      additionalProperties: false
      properties:
        command:
          type: string
          description: the command, as `sh -c` takes it
          x-fyai-short: c
          x-fyai-meta: COMMAND
        shell:
          type: string
          description: the shell (default $SHELL)
          x-fyai-meta: PATH
          x-fyai-complete: file
        login:
          type: boolean
          description: run the shell as a login shell
          x-fyai-short: l
        hold:
          type: boolean
          description: keep the last screen until a key
        rows:
          type: integer
          minimum: 1
          description: the rows, for a run with no terminal
          x-fyai-meta: N
        cols:
          type: integer
          minimum: 1
          description: the columns, for a run with no terminal
          x-fyai-meta: N
        screen:
          type: string
          description: write the last screen as text to FILE
          x-fyai-meta: FILE
          x-fyai-complete: file

  - command: reset
    aliases: [rewind]
    title: move the head of the branch to a reference
    description: |
      Move the head of the current branch to REF. The previous head stays
      in the ref log as `<branch>@{1}`.
    surfaces: [cli, session]
    handler: reset
    see_also: [refs, checkout]
    render:
      message: "{branch} is now at {ref} ({turns} turns); the previous head is {previous}"
    examples:
      - args: reset HEAD~2
        text: drop the last exchange
    arguments:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref:
          type: string
          minLength: 1
          description: the new head
          x-fyai-positional: 0
          x-fyai-meta: REF
          x-fyai-complete: ref

  - command: clear
    title: start a fresh conversation
    description: |
      Publish an empty head on the current branch. The earlier turns stay
      in the ref log.
    surfaces: [cli, session]
    handler: clear
    render:
      message: "conversation cleared"

  - command: api
    title: show or select the API grammar
    description: |
      With no mode, show the API grammar, the model, the provider, the URL,
      and max_tokens. With a mode, select that grammar of the provider and
      store it in the configuration.
    surfaces: [cli, session]
    handler: api
    while_busy: bare
    render:
      message:
        - "api: already {api}{?unchanged}"
        - "api: {api} (model {model}, provider {provider}, url {url}, max_tokens {max_tokens}){?shown}"
    arguments:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [responses, chat-completions, chat, messages]
          description: the API grammar
          x-fyai-positional: 0
          x-fyai-meta: MODE

  - command: context
    title: show the context fill and the token estimate
    description: |
      Show the context window of the model and the projected fill of the
      next request: the larger of the last measured input and an estimate
      of the prompt, and the output allowance.
    surfaces: [cli, session]
    handler: context
    flags: [transient]
    while_busy: run
    render:
      table:
        title: Context
        columns:
          api: {name: API}

  - command: stats
    title: show the token use and the cost
    description: |
      Show the token use and the cost, summed over the stored turns of the
      branch.
    surfaces: [cli, session]
    handler: stats
    while_busy: run
    arguments:
      type: object
      additionalProperties: false
      properties:
        raw:
          type: boolean
          description: write the Markdown source, not the rendering
          x-fyai-surfaces: [cli]

  - command: list
    title: list providers, models, turns, exchanges, or the ref log
    description: |
      List the configured providers, the models of the catalogue, the
      stored turns, the exchanges, or the ref log of the branch.
    surfaces: [cli, session]
    handler: list
    flags: [transient]
    view: true
    while_busy: run
    arguments:
      type: object
      additionalProperties: false
      properties:
        what:
          type: string
          enum: [providers, models, turns, exchanges, reflog]
          default: providers
          description: what to list
          x-fyai-positional: 0
          x-fyai-meta: WHAT
        full:
          type: boolean
          description: include the details of each item
        brief:
          type: boolean
          description: a summary of each item (the default)
          x-fyai-hidden: true
        json:
          type: boolean
          description: write JSON
          x-fyai-surfaces: [cli]
          x-fyai-hidden: true
        yaml:
          type: boolean
          description: write YAML
          x-fyai-surfaces: [cli]
          x-fyai-hidden: true
        raw:
          type: boolean
          description: write the Markdown source, not the rendering
          x-fyai-surfaces: [cli]
        markdown:
          type: boolean
          description: render the Markdown (the default)
          x-fyai-surfaces: [cli]
          x-fyai-hidden: true

  - command: diff
    title: compare two ref-log entries
    description: |
      Compare the exports of two ref-log entries, by default `HEAD@{1}`
      and `HEAD`: the change that the last operation made.
