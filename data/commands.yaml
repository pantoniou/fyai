  - command: __complete
    title: list the completion candidates of a command line
    description: |
      Write the candidates for the last word of the command line WORDS,
      one on each line as `value<TAB>description`, then one directive line
      that starts with `:`. The completion scripts call this command.
    surfaces: [cli]
    handler: complete
    hidden: true
    flags: [storage-optional]
    arguments:
      type: object
      additionalProperties: false
      properties:
        words:
          type: array
          items: {type: string}
          description: the words of the command line after `fyai`
          x-fyai-positional: 0
          x-fyai-meta: WORDS
