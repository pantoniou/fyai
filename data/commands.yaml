              x-fyai-meta: REF
              x-fyai-complete: ref

  - command: rebase
    title: put the exchanges of this branch after those of another
    description: |
      Append the exchanges of BRANCH to this branch, then the exchanges of
      this branch after them.
    surfaces: [cli]
    handler: join
    see_also: [merge]
