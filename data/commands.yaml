  - command: merge
    title: interleave the exchanges of two branches by time
    description: |
      Interleave the exchanges of BRANCH with the exchanges of this branch,
      in the order in which they happened.
    surfaces: [cli]
    handler: join
    see_also: [rebase]
    arguments:
      type: object
      required: [branch]
      additionalProperties: false
      properties:
        branch:
          type: string
          minLength: 1
          description: the other branch
          x-fyai-positional: 0
          x-fyai-meta: BRANCH
          x-fyai-complete: branch
        allow_unrelated:
          type: boolean
          description: join branches that have no common base

  - command: gc
    title: collect the garbage of the arena
    description: |
      Compact the arena. `--keep-reflogs N` also cuts the ref log to the
      last N entries.
    surfaces: [cli]
    handler: gc
    render:
      message:
        - "gc: compacted {arena}{?compacted}"
        - "gc: no arena at {arena}{?missing}"
    flags: [no-storage]
    arguments:
      type: object
      additionalProperties: false
      properties:
        keep_reflogs:
          type: integer
          minimum: 1
          description: keep only the last N ref-log entries
          x-fyai-meta: N

  - command: export
    title: write the conversation in the textual export format
    description: |
      Write the branch in the textual export format that `import` reads,
      to standard output or to FILE. REF exports the branch as it was at
      that ref-log entry.
    surfaces: [cli]
    handler: export
    flags: [transient]
    see_also: [refs]
    arguments:
      type: object
      additionalProperties: false
      properties:
        file:
          type: string
          description: the output file
          x-fyai-short: o
          x-fyai-meta: FILE
          x-fyai-complete: file
        ref:
          type: string
          description: a ref-log entry
          x-fyai-positional: 0
          x-fyai-meta: REF
          x-fyai-complete: ref

  - command: log
    aliases: [logging]
    title: control the trace logs
    description: |
      Show, start, stop, clear, or view the logs under .fyai/logs. TARGET is
      wire, stream, conversation, mcp, transport, or all. The logs never hold a
      credential: the values of key headers, bearer tokens, and the key itself
      are whited out when they are written.
    surfaces: [cli, session]
    default: show
    arguments:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [wire, stream, conversation, mcp, transport, all]
          default: all
          description: the log
          x-fyai-positional: 0
          x-fyai-meta: TARGET
    commands:
      - command: show
        title: show which logs are on
        description: Show which logs are on.
        handler: log
        render:
          message: "logging: wire {wire}, stream {stream}, conversation {conversation}, mcp {mcp}, transport {transport}"
        while_busy: run
      - command: start
        aliases: ["on"]
        title: start logging
        description: Start writing the log.
        handler: log
        render:
          message: "logging: wire {wire}, stream {stream}, conversation {conversation}, mcp {mcp}, transport {transport}"
        while_busy: run
      - command: stop
        aliases: ["off"]
        title: stop logging
        description: Stop writing the log.
        handler: log
        render:
          message: "logging: wire {wire}, stream {stream}, conversation {conversation}, mcp {mcp}, transport {transport}"
        while_busy: run
      - command: clear
        title: empty the log
        description: Remove the content of the log.
        handler: log
        render:
          message: "logging: cleared {cleared}"
      - command: view
        title: view the log
        description: Open the log in a viewer.
        handler: log

  - command: secret
    title: manage secrets without showing their values
    description: |
      Manage logical secrets in the machine-local secret store. A provider
      API key is conventionally named `api-key/<provider>`. A value is read
      from the terminal with no echo, or from standard input with `--stdin`;
      never from the command line.
    surfaces: [cli, session]
    default: status
    see_also: [api-key]
    commands:
      - command: status
        title: show the backend, or whether a secret exists
        description: Show the secret backend, or whether NAME exists.
        handler: secret
        render:
          message:
            - "secret backend: {backend}"
            - "secret {name}: {state}"
        flags: [no-storage]
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: the logical name
              x-fyai-positional: 0
              x-fyai-meta: NAME
      - command: set
        title: store a secret
        description: Store the value of NAME, read from the terminal.
        handler: secret
        flags: [no-storage]
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the logical name
              x-fyai-positional: 0
              x-fyai-meta: NAME
            stdin:
              type: boolean
              description: read the value from standard input
              x-fyai-surfaces: [cli]
      - command: delete
        title: remove a secret
        description: Remove NAME from the secret store.
        handler: secret
        flags: [no-storage]
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the logical name
              x-fyai-positional: 0
              x-fyai-meta: NAME

  - command: compact
    title: summarize the conversation into a fresh chain
    description: |
      Compact the conversation and start a new chain; the old head is kept
      as `compacted_from`. The Responses grammar can compact at the server;
      the other grammars summarize with one model request. HINT guides the
      summary.
    surfaces: [cli, session]
    handler: compact
    flags: [model, transient]
    arguments:
      type: object
      additionalProperties: false
      properties:
        hint:
          type: string
          description: what the summary must keep
          x-fyai-positional: 0
          x-fyai-rest: true
          x-fyai-meta: HINT

  - command: config
    title: inspect or change the configuration of the branch
    description: |
      The configuration is a document stored with each branch. Paths are
      slash-separated keys, and values are YAML flow documents; see
      `help config-paths`.
    surfaces: [cli, session]
    default: show
    see_also: [config-paths, model]
    commands:
      - command: show
        title: write the stored configuration
        description: Write the configuration document of the branch as YAML.
        handler: config_show
        view: true
        while_busy: run
        render:
          document: yaml

      - command: effective
        title: write the merged configuration
        description: |
          Write the configuration that this run uses: the branch
          configuration, then `--config`, then `--set`. Derived values, such
          as the endpoint, are not in it.
        handler: config_effective
        view: true
        while_busy: run
        render:
          document: yaml

      - command: get
        title: write the value of a key
        description: Write the value of a key as one line of YAML flow.
        handler: config_get
        while_busy: run
        arguments:
          type: object
          required: [key]
          additionalProperties: false
          properties:
            key:
              type: string
              minLength: 1
              description: the configuration path
              x-fyai-positional: 0
              x-fyai-meta: KEY
              x-fyai-complete: config-path
        render:
          document: flow

      - command: set
        title: set the value of a key
        description: |
          Set a key to a value. The value is parsed as a YAML flow
          document and checked against the configuration schema.
        handler: config_set
        examples:
          - args: config set display/theme 'ember:auto'
            text: select a palette theme
        arguments:
          type: object
          required: [key, value]
          additionalProperties: false
          properties:
            key:
              type: string
              minLength: 1
              description: the configuration path
              x-fyai-positional: 0
              x-fyai-meta: KEY
              x-fyai-complete: config-path
            value:
              type: string
              description: the value, as a YAML flow document
              x-fyai-positional: 1
              x-fyai-rest: true
              x-fyai-meta: VALUE
              x-fyai-complete: config-value
        render:
          message: []

      - command: delete
        title: remove a key
        description: Remove a key from the configuration of the branch.
        handler: config_delete
        arguments:
          type: object
          required: [key]
          additionalProperties: false
          properties:
            key:
              type: string
              minLength: 1
              description: the configuration path
              x-fyai-positional: 0
              x-fyai-meta: KEY
              x-fyai-complete: config-path
        render:
          message: []

      - command: import
        title: store a configuration file
        description: |
          Check a YAML configuration file against the schema and store it as
          the configuration of the branch.
        handler: config_import
        arguments:
          type: object
          required: [file]
          additionalProperties: false
          properties:
            file:
              type: string
              minLength: 1
              description: the YAML file
              x-fyai-positional: 0
              x-fyai-meta: FILE
              x-fyai-complete: file
        render:
          message: "config: imported {file}"

      - command: export
        title: write the configuration to a file
        description: |
          Write the configuration of the branch as YAML to FILE, or to
          standard output.
        handler: config_export
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            file:
              type: string
              description: the output file
              x-fyai-positional: 0
              x-fyai-meta: FILE
              x-fyai-complete: file
        render:
          document: yaml

      - command: edit
        title: edit the configuration in an editor
        description: |
          Edit the configuration with $VISUAL or $EDITOR. A session runs the
          editor in the work pane and applies the edit when it ends.
        handler: config_edit

      - command: validate
        title: check the configuration against the schema
        description: Check the stored configuration against its JSON Schema.
        handler: config_validate
        while_busy: run
        render:
          message: "config: valid"

      - command: schema
        title: write the configuration schema
        description: Write the JSON Schema of the configuration document.
        handler: config_schema
        flags: [no-storage]
        view: true
        while_busy: run
        render:
          document: yaml

      - command: describe
        title: describe the keys of the configuration
        description: |
          Show a table of the keys below PATH: the type, the constraints,
          the default, and the description. With no path, describe the whole
          document.
        handler: config_describe
        flags: [no-storage]
        view: true
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            path:
              type: string
              description: the configuration path
              x-fyai-positional: 0
              x-fyai-meta: PATH
              x-fyai-complete: config-path

  - command: view
    title: create and enter separate project filesystem views
    description: |
      Capture a project into immutable CAS objects and use a separate writable
      OverlayFS view. Commands in a view do not apply changes to the host.
      The initial Linux implementation materializes an ordinary-file baseline.
    surfaces: [cli]
    default: list
    commands:
      - command: create
        title: capture a project and create a named view
        description: |
          Capture PROJECT, excluding its reserved .fyai directory, and record
          a named view on the active branch. Reject unsupported metadata and
          observed concurrent changes. No provider credential is required.
        handler: view_create
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            durability:
              type: string
              enum: [lazy, durable]
              description: select lazy persistence or a durable filesystem barrier; default from view/durability
              x-fyai-long: durability
              x-fyai-meta: POLICY
            copy_git_objects:
              type: boolean
              default: false
              description: copy Git object bytes instead of borrowing host inodes
              x-fyai-long: copy-git-objects
            debug:
              type: boolean
              default: false
              description: show capture progress and the final summary
              x-fyai-long: debug
            quiet:
              type: boolean
              default: false
              description: suppress debug progress and the summary unless an output format is requested
              x-fyai-long: quiet
            verify:
              type: boolean
              default: false
              description: independently verify copied bytes and hashes serially before publication
              x-fyai-long: verify
            name:
              type: string
              description: the name of the separate view
              pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
              x-fyai-positional: 0
              x-fyai-meta: NAME
            project:
              type: string
              description: the project directory to capture
              default: '.'
              x-fyai-positional: 1
              x-fyai-meta: PROJECT
              x-fyai-complete: dir
        render:
          document: yaml
      - command: list
        title: list the filesystem views of the active branch
        description: Show the project, baseline, result, and state of each view.
        handler: view_list
        render:
          document: yaml
      - command: show
        title: inspect a named filesystem view
        description: Show a view's baseline and latest recorded result identity.
        handler: view_show
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: the name of the view to inspect
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
        render:
          document: yaml
      - command: update
        title: replace a view with a fresh host snapshot
        description: |
          Capture the host project again and replace the named view with a fresh
          baseline and empty upper. Discard the view's changes without changing
          the host project. Refuse the update while the view is in use.
        handler: view_update
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            durability:
              type: string
              enum: [lazy, durable]
              description: select lazy persistence or a durable filesystem barrier; update inherits the view policy
              x-fyai-long: durability
              x-fyai-meta: POLICY
            copy_git_objects:
              type: boolean
              default: false
              description: copy Git object bytes instead of borrowing host inodes
              x-fyai-long: copy-git-objects
            debug:
              type: boolean
              default: false
              description: show capture progress and the final summary
              x-fyai-long: debug
            quiet:
              type: boolean
              default: false
              description: suppress debug progress and the summary unless an output format is requested
              x-fyai-long: quiet
            verify:
              type: boolean
              default: false
              description: independently verify copied bytes and hashes serially before publication
              x-fyai-long: verify
            name:
              type: string
              description: the name of the view to replace
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
        render:
          document: yaml
      - command: diff
        title: compare recorded filesystem view snapshots
        description: |
          Compare NAME's baseline and recorded result, or the recorded results
          of NAME and OTHER. Skip .git and .fyai. Show a unified patch, including
          binary changes, or a changed-path list with --stat. Output formats
          return structured content and metadata changes with the patch.
        handler: view_diff
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: the view to compare
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
            other:
              type: string
              description: compare against this view's recorded result
              x-fyai-positional: 1
              x-fyai-meta: OTHER
              x-fyai-complete: view
            unified:
              type: boolean
              default: false
              description: write unified rows, coloured on a terminal
              x-fyai-short: u
            stat:
              type: boolean
              default: false
              description: list changed paths instead of emitting a unified patch
              x-fyai-long: stat
        render:
          message: '{patch}'
      - command: remove
        title: remove a named filesystem view
        description: |
          Remove the named view from the active branch. Keep CAS objects and
          cached runtime files for retained history and garbage collection.
          Refuse removal while a command is using the view or it is mounted.
        handler: view_remove
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: the filesystem view to remove
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
        render:
          message: 'Removed view {name}.'
      - command: sync
        title: force a filesystem view to persistent storage
        description: |
          Flush the view's CAS objects and backing files before recording that
          its current snapshot is synchronized. Keep its configured durability
          policy. Refuse synchronization while a command is using the view.
        handler: view_sync
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: the filesystem view to synchronize
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
        render:
          document: yaml
      - command: mount
        title: mount a view for read-only inspection
        description: |
          Mount the named view at an empty directory for inspection and comparison.
          The read-only mount persists in the current mount namespace until unmount.
          Mount privileges are required; rootless inspection can use an explicitly
          started unshare -Urnm sh session. Unmount before entering or updating.
        handler: view_mount
        arguments:
          type: object
          additionalProperties: false
          required: [name, path]
          properties:
            name:
              type: string
              description: the view to inspect
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
            path:
              type: string
              description: an empty mount directory, created when absent
              x-fyai-positional: 1
              x-fyai-meta: PATH
              x-fyai-complete: dir
        render:
          document: yaml
      - command: unmount
        title: unmount the recorded inspection view
        description: |
          Verify the recorded namespace, mount IDs, and source before releasing
          the inspection mount. Busy mounts are retained. Run in the namespace
          that owns the mount and unmount before leaving a rootless inspection shell.
        handler: view_unmount
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: the mounted view to release
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
        render:
          document: yaml
      - command: enter
        title: enter a private filesystem view
        description: |
          Mount the named view in private namespaces and start a shell in its project
          directory, or execute the remaining command arguments directly. Standard
          input, output, and error are inherited. Record the result in CAS on exit.
          The host project stays separate. This operation requires Linux user
          namespaces, OverlayFS, and Landlock.
        handler: view_enter
        arguments:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            verify:
              type: boolean
              default: false
              description: independently verify copied bytes and hashes serially before publication
              x-fyai-long: verify
            name:
              type: string
              description: the name of the view to enter
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: view
            command:
              type: array
              items: {type: string}
              description: the command and arguments to execute; omit to start a shell
              x-fyai-positional: 1
              x-fyai-rest: true
              x-fyai-meta: COMMAND

  - command: sandbox
    title: show or set the stored sandbox policy
    description: |
      Show or change the `sandbox` key of the configuration. `on` stores a
      policy that denies secrets and ~/.ssh and allows port 443; `edit`
      edits the whole configuration. In a session, `/sandbox` is the setting
      of the session instead.
    surfaces: [cli]
    default: show
    see_also: [config]
    commands:
      - command: show
        aliases: [get]
        title: write the stored sandbox value
        description: Write the stored sandbox value as YAML.
        handler: sandbox_show
        render:
          document: yaml
      - command: "on"
        aliases: [enable]
        title: store the default sandbox policy
        description: Store the default sandbox policy.
        handler: sandbox_set
        render:
          message: []
      - command: "off"
        aliases: [disable]
        title: store no sandbox
        description: Store `sandbox false`.
        handler: sandbox_set
        render:
          message: []
      - command: edit
        title: edit the configuration in an editor
        description: Edit the configuration with $VISUAL or $EDITOR.
        handler: config_edit

  - command: catalog
    title: inspect or change the model catalogue of the branch
    description: |
      The catalogue lists the providers, their endpoints, and the models
      they offer. Each branch owns its catalogue. A path is slash-separated;
      an item of a list is named by its name, such as
      `providers/openai/models/gpt-5`.
    surfaces: [cli, session]
    default: show
    see_also: [model, config]
    commands:
      - command: show
        title: summarize the catalogue
        description: Show a summary of the catalogue of the branch.
        handler: catalog_show
        view: true
        while_busy: run
        render:
          document: yaml

      - command: list
        title: list the models or the providers
        description: List the models, or the providers, of the catalogue.
        handler: catalog_list
        view: true
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            what:
              type: string
              enum: [models, providers]
              default: models
              description: what to list
              x-fyai-positional: 0
              x-fyai-meta: WHAT

      - command: tools
        title: list the tools of a coding agent
        description: List the tools of the coding agents of the catalogue.
        handler: catalog_tools
        view: true
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            agent:
              type: string
              description: the agent
              x-fyai-positional: 0
              x-fyai-meta: AGENT
              x-fyai-complete: catalog-agent
            full:
              type: boolean
              description: show the complete tool descriptions
            brief:
              type: boolean
              description: show the summary of each tool (the default)
              x-fyai-hidden: true

      - command: get
        title: write the value at a path
        description: Write the value at a path of the catalogue as YAML.
        handler: catalog_get
        while_busy: run
        render:
          document: yaml
        arguments:
          type: object
          required: [path]
          additionalProperties: false
          properties:
            path:
              type: string
              minLength: 1
              description: the catalogue path
              x-fyai-positional: 0
              x-fyai-meta: PATH
              x-fyai-complete: catalog-path

      - command: set
        title: set the value at a path
        description: |
          Set the value at a path. The value is a YAML flow document; the
          catalogue is checked against its schema before it is stored.
        handler: catalog_set
        arguments:
          type: object
          required: [path, value]
          additionalProperties: false
          properties:
            path:
              type: string
              minLength: 1
              description: the catalogue path
              x-fyai-positional: 0
              x-fyai-meta: PATH
              x-fyai-complete: catalog-path
            value:
              type: string
              description: the value, as a YAML flow document
              x-fyai-positional: 1
              x-fyai-rest: true
              x-fyai-meta: VALUE
              x-fyai-complete: catalog-value

      - command: delete
        title: remove the value at a path
        description: Remove the value at a path of the catalogue.
        handler: catalog_delete
        arguments:
          type: object
          required: [path]
          additionalProperties: false
          properties:
            path:
              type: string
              minLength: 1
              description: the catalogue path
              x-fyai-positional: 0
              x-fyai-meta: PATH
              x-fyai-complete: catalog-path

      - command: import
        title: store a catalogue file
        description: Check a catalogue file against the schema and store it.
        handler: catalog_import
        render:
          message: "catalog: imported {file} ({models} models, {providers} providers)"
        arguments:
          type: object
          required: [file]
          additionalProperties: false
          properties:
            file:
              type: string
              minLength: 1
              description: the catalogue file
              x-fyai-positional: 0
              x-fyai-meta: FILE
              x-fyai-complete: file

      - command: export
        title: write the catalogue to a file
        description: Write the catalogue as YAML to FILE, or to standard output.
        handler: catalog_export
        render:
          document: yaml
        while_busy: run
        arguments:
          type: object
          additionalProperties: false
          properties:
            file:
              type: string
              description: the output file
              x-fyai-positional: 0
              x-fyai-meta: FILE
              x-fyai-complete: file

      - command: edit
        title: edit the catalogue in an editor
        description: |
          Edit the catalogue with $VISUAL or $EDITOR. A session runs the
          editor in the work pane and applies the edit when it ends.
        handler: catalog_edit

      - command: validate
        title: check the catalogue against the schema
        description: Check the catalogue of the branch against its schema.
        handler: catalog_validate
        while_busy: run
        render:
          message: "catalog: valid"

      - command: schema
        title: write the catalogue schema
        description: Write the JSON Schema of the catalogue.
        handler: catalog_schema
        flags: [no-storage]
        view: true
        while_busy: run
        render:
          document: yaml

      - command: reset
        title: return to the embedded catalogue
        description: Remove the catalogue of the branch; the embedded one applies.
        handler: catalog_reset
        render:
          message: "catalog: the branch uses the embedded catalogue"

      - command: update
        title: update the catalogue from the providers
        description: |
          Run `catalog_update/command` and store its output. The program
          keeps only the credentials that `catalog_update/credentials`
          names. A session runs it in the work pane.
        handler: catalog_update
        arguments:
          type: object
          additionalProperties: false
          properties:
            curated:
              type: boolean
              description: keep only the curated models
            provider:
              type: array
              items: {type: string}
              description: update only this provider
              x-fyai-repeat: true
              x-fyai-meta: NAME
              x-fyai-complete: provider
            names:
              type: array
              items: {type: string}
              description: update only these providers
              x-fyai-positional: 0
              x-fyai-meta: PROVIDER
              x-fyai-complete: provider

  - command: history
    aliases: [transcript, display]
    title: show the conversation of the branch
    description: |
      Render the stored conversation: the exchanges, the tool calls, and
      their results. Select the exchanges with `--first N`, `--last N`, or
      `--range A,B` (from 0, inclusive), or in a session with `all`,
      `first N`, `last N`, or `range A,B`.

      With `--output json` or `--output yaml`, write each stored message as
      one document, as it streams.
    surfaces: [cli, session]
    handler: history
    mode: stream
    view: true
    while_busy: run
    see_also: [output]
    examples:
      - args: history --last 2
        text: show the last two exchanges
      - args: history --output json
        text: write the messages as JSON Lines
    arguments:
      type: object
      additionalProperties: false
      properties:
        select:
          type: array
          items: {type: string}
          description: all, first N, last N, or range A,B
          x-fyai-positional: 0
          x-fyai-meta: SELECTION
          x-fyai-complete: history-select
        first:
          type: integer
          minimum: 0
          description: the first N exchanges
          x-fyai-meta: N
        last:
          type: integer
          minimum: 0
          description: the last N exchanges
          x-fyai-meta: N
        range:
          type: string
          pattern: "^[0-9]+[,:][0-9]+$"
          description: the exchanges A to B, from 0, inclusive
          x-fyai-meta: A,B
        raw:
          type: boolean
          description: write the Markdown source, not the rendering
          x-fyai-surfaces: [cli]
        tool_detail:
          type: string
          enum: [none, brief, default, full]
          description: how much of each tool result to show
          x-fyai-meta: MODE
    stream:
      item: {type: object}
      render: markdown

  - command: auth
    title: manage the subscription login of a provider
    description: |
      Manage the machine-local ChatGPT subscription credentials. PROVIDER
      names the subscription provider; only `openai` is supported.
    surfaces: [cli, session]
    default: status
    see_also: [api-key]
    arguments:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          default: openai
          description: the subscription provider
          x-fyai-positional: 0
          x-fyai-meta: PROVIDER
          x-fyai-complete: provider
    commands:
      - command: status
        title: show the login and the health of the credentials
        description: Show the login and the health of the stored credentials.
        flags: [no-storage, transient]
        handler: auth_status
        while_busy: run
        render:
          table:
            title: Authentication
            columns:
              status: {format: humanize}
              configured_mode: {name: Configured mode}
              effective_method: {name: Effective method}
              plan_usage_authorized: {name: Plan usage authorized}
              client_id: {name: Client registration}
              account_id: {name: Account}
              plan: {name: Subscription}
              expires_at: {name: Token expires}
              fedramp: {name: FedRAMP account}
              storage: {name: Credential storage}

      - command: info
        title: show the subscription and the account
        description: Show the details of the subscription and the account.
        flags: [no-storage, transient]
        handler: auth_status
        while_busy: run
        render:
          table:
            title: Authentication
            columns:
              status: {format: humanize}
              configured_mode: {name: Configured mode}
              effective_method: {name: Effective method}
              plan_usage_authorized: {name: Plan usage authorized}
              client_id: {name: Client registration}
              account_id: {name: Account}
              plan: {name: Subscription}
              expires_at: {name: Token expires}
              fedramp: {name: FedRAMP account}
              storage: {name: Credential storage}

      - command: usage
        title: show recorded usage and subscription settings
        description: Show selected-conversation token totals and the ChatGPT settings link for account limits and credit permissions.
        flags: [storage-optional, transient]
        handler: auth_usage
        render:
          table: {title: Recorded usage and ChatGPT plan settings}

      - command: login
        title: sign in to the subscription
        description: |
          Register fyai and authorize ChatGPT plan usage with a browser and
          a loopback callback. Reuse the active registration, select one with
          `--account`, or add one with `--new-account`. `--no-browser` writes
          the URL; `--manual` reads a complete pasted redirect URL. Device-code
          registration is not supported. `^C` or Escape cancels.
        flags: [no-storage, transient]
        handler: auth_login
        mode: async
        arguments:
          type: object
          additionalProperties: false
          properties:
            device_code:
              type: boolean
              description: reject the unsupported legacy device-code flow
            account:
              type: string
              description: reuse the issued client ID of a saved account
              x-fyai-meta: CLIENT_ID
            new_account:
              type: boolean
              description: register another ChatGPT account or workspace
            no_browser:
              type: boolean
              description: write the URL and start no browser
            manual:
              type: boolean
              description: paste the complete redirect URL back without a local browser
        render:
          message: "auth: login succeeded"

      - command: accounts
        title: list saved ChatGPT registrations
        description: List saved accounts and workspace registrations without tokens.
        flags: [no-storage, transient]
        handler: auth_accounts
        while_busy: run
        render:
          table:
            title: ChatGPT accounts
            columns:
              client_id: {name: Client registration}
              email: {name: Email}
              subject: {name: Account}
              active: {name: Active}
              signed_in: {name: Signed in}

      - command: logout
        title: sign out and remove the credentials
        description: |
          Revoke the login when the provider allows it, and remove the local
          tokens. Keep the client registration and host ID for later sign-in.
        flags: [no-storage, transient]
        handler: auth_logout
        render:
          message: "auth: logged out"

  - command: mcp
    title: inspect and control the MCP servers
    description: |
      In a session, show the MCP servers, sign in to or out of one, or turn
      them all on or off. A verb imports the OAuth client of a server.
    surfaces: [cli, session]
    default: {session: status}
    commands:
      - command: status
        aliases: [show]
        title: show the MCP servers and their state
        description: Show the live MCP connections, or the configured servers.
        surfaces: [session]
        handler: mcp_status
        view: true
        while_busy: run
      - command: login
        title: sign in to an MCP server
        description: Start the OAuth sign-in of the server NAME.
        surfaces: [session]
        handler: mcp_login
        render:
          message: "mcp: login started for {server}"
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the server
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: mcp-server
      - command: logout
        title: sign out of an MCP server
        description: Remove the credentials of the server NAME.
        surfaces: [session]
        handler: mcp_login
        render:
          message: "mcp: logged out {server}"
        arguments:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              description: the server
              x-fyai-positional: 0
              x-fyai-meta: NAME
              x-fyai-complete: mcp-server
      - command: "on"
        title: turn the MCP servers on
        description: Turn the MCP servers on and store `mcp/enabled`.
        surfaces: [session]
        handler: mcp_enable
        render:
          message:
            - "mcp: {state}{?changed}"
            - "mcp: already {state}{?unchanged}"
      - command: "off"
        title: turn the MCP servers off
        description: Turn the MCP servers off and store `mcp/enabled`.
        surfaces: [session]
        handler: mcp_enable
        render:
          message:
            - "mcp: {state}{?changed}"
            - "mcp: already {state}{?unchanged}"
      - command: oauth
        title: manage the OAuth clients of MCP servers
        description: Manage the pre-registered OAuth clients of MCP servers.
        surfaces: [cli]
        commands:
          - command: import-client
            title: import a pre-registered OAuth client
            description: |
              Import the OAuth client of the server NAME from FILE. The
              client secret goes to the machine-local secret store;
              `--secret-env` stores a reference to a variable instead.
            handler: mcp_import_client
            arguments:
              type: object
              required: [name, file, endpoint, scope]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  description: the server
                  x-fyai-positional: 0
                  x-fyai-meta: NAME
                  x-fyai-complete: mcp-server
                file:
                  type: string
                  minLength: 1
                  description: the client file
                  x-fyai-positional: 1
                  x-fyai-meta: FILE
                  x-fyai-complete: file
                endpoint:
                  type: string
                  minLength: 1
                  description: the endpoint of the server
                  x-fyai-meta: URL
                scope:
                  type: array
                  minItems: 1
                  items: {type: string}
                  description: an OAuth scope to request
                  x-fyai-repeat: true
                  x-fyai-meta: SCOPE
                secret_env:
                  type: string
                  description: store a reference to this variable
                  x-fyai-meta: NAME
                force:
                  type: boolean
                  description: replace an existing server

  - command: btw
    title: ask a side question in a tile
    description: |
      Ask QUESTION on a side branch, `agent:btw-N`, forked from the head,
      while a turn runs. The answer stays in its tile until Escape, the
      close button, or `/kill`.
    surfaces: [session]
    handler: btw
    while_busy: run
    arguments:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          description: the question
          x-fyai-positional: 0
          x-fyai-rest: true
          x-fyai-meta: QUESTION

  - command: branches
    title: open the branch browser
    description: Open the browser of the branches of the arena.
    surfaces: [session]
    handler: branches

  - command: resume
    aliases: [switch]
    title: resume another session
    description: |
      Continue a stored session, selected for this invocation: HEAD does
      not move, and the working directory does not change. SESSION names
      it; with none, the picker selects. `--last` resumes the session
      updated last. The sessions that started in this directory are
      offered; `--all` offers every one.
    surfaces: [cli, session]
    handler: resume
    early: resume
    prepare: resume
    flags: [model, interactive]
    arguments:
      type: object
      additionalProperties: false
      properties:
        all:
          type: boolean
          description: offer the sessions of every directory
        last:
          type: boolean
          description: resume the session updated last
          x-fyai-surfaces: [cli]
        session:
          type: string
          description: the session
          x-fyai-positional: 0
          x-fyai-meta: SESSION
          x-fyai-complete: session

  - command: zoom
    title: give a live tile the pane and the keys
    description: |
      Give the tile NAME, or the newest tile, the pane and the keys, to
      type into a shell or a sub-agent. `Ctrl-]` comes back; `/zoom off`
      shows every tile again.
    surfaces: [session]
    handler: zoom
    render:
      message:
        - "typing into {zoomed}; Ctrl-Tab/Ctrl-T moves focus; Ctrl-] comes back"
        - "no live shell session or sub-agent is called that{?unknown}"
        - "nothing is running to zoom into{?idle}"
    while_busy: run
    arguments:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: the tile, or off
          x-fyai-positional: 0
          x-fyai-meta: NAME

  - command: page
    title: show and review the page of the screen
    description: |
      Show the page that draws the screen, or paint and name its areas to
      see which part of the page document draws which rows.
    surfaces: [cli, session]
    default: {session: show}
    commands:
      - command: show
        title: show the page of the screen and its state
        description: Show the page document in use, and the state, source, and regions of the last frame.
        surfaces: [session]
        handler: page
        view: true
        while_busy: run
      - command: review
        title: paint and name the areas of the screen
        description: |
          Give each area of the live page a colour and write its name at its
          top left: each slot, and each row by the flag that shows it or the
          page it comes from. Without ON or OFF the review is turned over.
        surfaces: [session]
        handler: page_review
        while_busy: run
        render:
          message: "page review: {review}"
        arguments:
          type: object
          additionalProperties: false
          properties:
            how:
              type: string
              enum: ["on", "off"]
              description: turn the review on or off
              x-fyai-positional: 0
              x-fyai-meta: ON|OFF
      - command: review
        title: draw a sample page with its areas painted and named
        description: |
          Render the page document with the state SAMPLE, give each area a
          colour and its name, and list the areas. The slots are empty: a
          sample has no transcript, tiles, or prompt to draw in them. The
          document is the embedded one, or the file of --page, which must
          load as display/page does.
        surfaces: [cli]
        handler: page_review_sample
        flags: [no-storage]
        render:
          table:
            title: Areas of the page
            keys: [area, kind, row, col, width, height]
        arguments:
          type: object
          additionalProperties: false
          properties:
            sample:
              type: string
              enum: [prompt, inline, question, popup]
              default: prompt
              description: the state of the page
              x-fyai-positional: 0
              x-fyai-meta: SAMPLE
            width:
              type: integer
              minimum: 20
              default: 80
              description: the columns of the page
              x-fyai-meta: N
            height:
              type: integer
              minimum: 5
              default: 24
              description: the rows of the page
              x-fyai-meta: N
            page:
              type: string
              description: the page document to review, in place of the embedded one
              x-fyai-meta: FILE
              x-fyai-complete: file

  - command: sessions
    title: list the live shell sessions and sub-agents
    description: List the live shell sessions and sub-agents of the work pane.
    surfaces: [session]
    handler: sessions
    while_busy: run
    render:
      table:
        title: Active sessions
        empty: no active sessions
        keys: [name, kind, state]

  - command: kill
    title: stop a shell session or sub-agent
    description: Stop the live shell session or sub-agent NAME.
    surfaces: [session]
    handler: kill
    render:
      message: "{action} {name}"
    arguments:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: the session or sub-agent
          x-fyai-positional: 0
          x-fyai-meta: NAME

  - command: status
    title: show the model, provider, login, and use
    description: Show the model, the provider, the login, and the token use of the session.
    surfaces: [session]
    handler: status
    while_busy: run
    render:
      table:
        title: Session
        columns:
          api: {name: API}

  - command: profiles
    title: list the egress profiles of the credential transport
    description: |
      List the egress profiles of the credential transport and whether the
      agent may use each one. The agent is the session itself, or with
      `--agent` a sub-agent that it started, by the name it was delegated
      under, its branch, or its transport execution number. A credential
      source is named, never its value.
    surfaces: [session]
    handler: profiles
    while_busy: run
    flags: [transient]
    arguments:
      type: object
      additionalProperties: false
      properties:
        agent:
          type: string
          minLength: 1
          description: list for this sub-agent instead of the session
          x-fyai-meta: AGENT
    render:
      table:
        title: Profiles
        empty: no profiles
        keys: [name, granted, url, auth, credential, model, granted_model, tag]
        columns:
          name: {name: Profile, align: left}
          granted: {name: Granted, format: mark}
          url: {name: URL, align: left}
          auth: {name: Auth, align: left}
          credential: {name: Credential, align: left}
          model: {name: Model, align: left}
          granted_model: {name: Narrowed to, align: left}
          tag: {name: Tag, align: left}

  - command: usage
    title: show recorded usage and subscription settings
    description: Show selected-conversation token totals and the ChatGPT settings link for account limits and credit permissions.
    surfaces: [session]
    handler: auth_usage
    render:
      table: {title: Recorded usage and ChatGPT plan settings}
    flags: [transient]

  - command: tools
    title: list the tools of a coding agent
    description: List the tools of the coding agents of the catalogue; `/catalog tools` is the same.
    surfaces: [session]
    handler: catalog_tools
    while_busy: run
    arguments:
      type: object
      additionalProperties: false
      properties:
        agent:
          type: string
          description: the agent
          x-fyai-positional: 0
          x-fyai-meta: AGENT
          x-fyai-complete: catalog-agent
        full:
          type: boolean
          description: show the complete tool descriptions
        brief:
          type: boolean
          description: show the summary of each tool (the default)
          x-fyai-hidden: true

  - command: exit
    aliases: [quit]
    title: leave the session
    description: Leave the session.
    surfaces: [session]
    handler: exit
    ends_session: true

  - command: reload
    title: restart the current session
    description: >-
      Commit the current branch and restart fyai on it. Live shells and
      sub-agents must finish or close first. A transient session and a pinned
      root cannot be reloaded.
    surfaces: [session]
    handler: reload

  - command: agent
    title: run one sub-agent on a task
    description: |
      Run one autonomous sub-agent on TASK and write its final report. The
      agent runs its own tool loop with the built-in persona and tools; it
      cannot ask questions or start further agents. It shares the workspace,
      and stores its run on the branch unless `--transient` is given.

      With `--rpc` it takes no task and serves the sub-agent control
      protocol, JSON-RPC 2.0 framed by lines, on standard input and output:
      initialize, agent/run, and shutdown. See doc/agent-protocol.md.
    surfaces: [cli]
    handler: agent
    prepare: agent
    flags: [model]
    arguments:
      type: object
      additionalProperties: false
      properties:
        rpc:
          type: boolean
          description: serve the sub-agent control protocol
        tool_child:
          type: boolean
          description: run as the executed tool child of a session
          x-fyai-hidden: true
        pty:
          type: boolean
          description: the tool child has a terminal
          x-fyai-hidden: true
        arena:
          type: string
          description: the arena of the parent session
          x-fyai-hidden: true
        task:
          type: string
          description: the task
          x-fyai-positional: 0
          x-fyai-rest: true
          x-fyai-meta: TASK

  - command: transport
    title: serve model requests for isolated agents
    description: |
      Run the credential transport. It holds the provider credentials and sends
      the requests of agents that hold none. A supervisor starts it, and it
      takes its orders on a control channel: a socket that it inherits on
      descriptor `--control-fd`, framed as one JSON message for each datagram.
      The protocol is in doc/agent-transport-isolation-sdd.md. It ends when the
      channel closes. It sets itself not dumpable, closes every other
      descriptor, and leaves the terminal session. A person does not normally run
      it.
    surfaces: [cli]
    handler: transport
    early: transport
    flags: [no-storage]
    arguments:
      type: object
      additionalProperties: false
      required: [control_fd]
      properties:
        control_fd:
          type: integer
          minimum: 3
          description: the descriptor of the control channel
          x-fyai-meta: FD
        arena:
          type: string
          description: the arena whose logs directory receives the transport log
          x-fyai-meta: DIR

  - command: reasoning-effort
    aliases: [effort]
    title: the reasoning effort of the model
    description: |
      With no value, show the reasoning effort of the model. With a value,
      change it; the configuration schema gives the values. `reasoning/effort` is the
      key; a session-scoped key changes for this session only, any other
      key is stored.
    surfaces: [session]
    handler: setting
    setting: {key: reasoning/effort}
    while_busy: bare
    arguments:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
          description: the new value
          x-fyai-positional: 0
          x-fyai-meta: VALUE
          x-fyai-complete: setting-value
    render:
      message: "{setting}: {value}"

  - command: reasoning-summary
    aliases: [summary]
    title: the reasoning summary that the model writes
    description: |
      With no value, show the reasoning summary that the model writes. With a value,
      change it; the configuration schema gives the values. `reasoning/summary` is the
      key; a session-scoped key changes for this session only, any other
      key is stored.
    surfaces: [session]
    handler: setting
    setting: {key: reasoning/summary}
    while_busy: bare
    arguments:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
          description: the new value
          x-fyai-positional: 0
          x-fyai-meta: VALUE
          x-fyai-complete: setting-value
    render:
      message: "{setting}: {value}"

  - command: temperature
    title: the sampling temperature
    description: |
      With no value, show the sampling temperature. With a value,
      change it; the configuration schema gives the values. `temperature` is the
      key; a session-scoped key changes for this session only, any other
      key is stored.
    surfaces: [session]
    handler: setting
    setting: {key: temperature}
    while_busy: bare
    arguments:
      type: object
      additionalProperties: false
      properties:
        value:
