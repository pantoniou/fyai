# SPDX-License-Identifier: MIT
#
# The schema of data/commands.yaml. The registry is checked against it when
# it loads, and a unit test checks the embedded document.

$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [commands]
additionalProperties: false
properties:
  global:
    type: object
    required: [arguments]
    additionalProperties: false
    properties:
      title: {type: string}
      description: {type: string}
      arguments: {$ref: "#/$defs/arguments"}
  topics:
    type: array
    items:
      type: object
      required: [topic, title, description]
      additionalProperties: false
      properties:
        topic: {$ref: "#/$defs/word"}
        title: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
  commands:
    type: array
    items: {$ref: "#/$defs/command"}

$defs:
  word:
    type: string
    pattern: "^[a-z_][a-z0-9_-]*$"

  subcommand:
    oneOf:
      - {$ref: "#/$defs/word"}
      - type: object
        additionalProperties: false
        properties:
          cli: {$ref: "#/$defs/word"}
          session: {$ref: "#/$defs/word"}

  surface:
    type: string
    enum: [cli, session]

  arguments:
    type: object
    required: [type]
    properties:
      type: {const: object}
      properties:
        type: object
        additionalProperties: {$ref: "#/$defs/property"}

  # The keywords that the argument scanner of src/fyai_cmd.c checks. The
  # scanner does not validate an argument against its schema: a keyword that
  # is not here would be ignored, so a definition cannot use one.
  property:
    type: object
    required: [type, description]
    additionalProperties: false
    properties:
      type:
        enum: [string, integer, number, boolean, array]
      description: {type: string, minLength: 1}
      default: {}
      enum: {type: array}
      minLength: {type: integer, minimum: 0}
      minimum: {type: number}
      maximum: {type: number}
      pattern: {type: string}
      minItems: {type: integer, minimum: 0}
      items:
        type: object
        additionalProperties: false
        properties:
          type:
            enum: [string, integer, number, boolean]
          enum: {type: array}
          minLength: {type: integer, minimum: 0}
          minimum: {type: number}
          maximum: {type: number}
          pattern: {type: string}
      x-fyai-positional: {type: integer, minimum: 0}
      x-fyai-rest: {type: boolean}
      # A long option of a foreign grammar, such as the Claude CLI, can
      # have capitals.
      x-fyai-long:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
      x-fyai-short:
        type: string
        pattern: "^[A-Za-z0-9]$"
      x-fyai-meta: {type: string, minLength: 1}
      x-fyai-complete: {type: string, minLength: 1}
      x-fyai-repeat: {type: boolean}
      x-fyai-negate: {type: boolean}
      x-fyai-hidden: {type: boolean}
      x-fyai-surfaces:
        type: array
        items: {$ref: "#/$defs/surface"}

  command:
    type: object
    required: [command, title, description]
    additionalProperties: false
    properties:
      command:
        type: string
        pattern: "^[a-z_][a-z0-9_-]*$"
      aliases:
        type: array
        items: {$ref: "#/$defs/word"}
      title: {type: string, minLength: 1}
      description: {type: string, minLength: 1}
      surfaces:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/surface"}
      hidden: {type: boolean}
      handler: {$ref: "#/$defs/word"}
      prepare: {$ref: "#/$defs/word"}
      early: {$ref: "#/$defs/word"}
      mode:
        enum: [result, stream, async]
      flags:
        type: array
        items:
          enum: [model, model-state, no-storage, storage-optional, transient,
                 interactive]
      view: {type: boolean}
      scope:
        description: >-
          where the command runs when the session is remote: view, in the
          client, for a command that changes only what the client shows;
          engine, the default, in the process that owns the session
        enum: [view, engine]
      ends_session: {type: boolean}
      status: {type: boolean}
      setting:
        type: object
        required: [key]
        additionalProperties: false
        properties:
          key: {type: string, minLength: 1}
      while_busy:
        enum: [run, wait, bare]
      default: {$ref: "#/$defs/subcommand"}
      fallback: {$ref: "#/$defs/subcommand"}
      examples:
        type: array
        items:
          type: object
          required: [args, text]
          additionalProperties: false
          properties:
            args: {type: string}
            text: {type: string}
      see_also:
        type: array
        items: {type: string}
      arguments: {$ref: "#/$defs/arguments"}
      result: {type: object}
      stream:
        type: object
        additionalProperties: false
        properties:
          item: {type: object}
          render:
            enum: [rows, markdown, lines]
      render:
        type: object
        additionalProperties: false
        properties:
          table: {type: object}
          document:
            enum: [yaml, flow]
          message:
            oneOf:
              - {type: string}
              - {type: array, items: {type: string}}
          markdown:
            oneOf:
              - {type: string}
              - {type: array, items: {type: string}}
      commands:
        type: array
        items: {$ref: "#/$defs/command"}
