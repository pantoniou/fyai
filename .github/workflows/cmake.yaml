name: CMake CI

run-name: >-
  ${{ github.event_name == 'pull_request'      && format('CMake CI · PR #{0}', github.event.pull_request.number) ||
      github.event_name == 'workflow_dispatch' && format('CMake CI · manual · os={0}', inputs.os || 'all') ||
      format('CMake CI · {0} · {1}', github.ref_name, github.event.head_commit.message) }}

env:
  # No parallelism caps: the build uses every core, and ctest takes
  # -j "$(nproc)" in the Test step. PTY wall-clock cases stay serial
  # through the fyai_pty resource lock whatever the job count is.
  CTEST_OUTPUT_ON_FAILURE: 1

on:
  push:
    branches: [ master, devel ]
  pull_request:
    branches: [ master, devel ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run (e.g. ubuntu-latest, macos-latest)"
        required: false
        default: ""
        type: string
      asan:
        description: "Enable ASAN (ON or OFF)"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}${{ matrix.asan == 'ON' && ' (ASAN)' || '' }}${{ matrix.transport == 'level-b' && ' (transport security)' || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            asan: OFF
            transport: none
          - os: ubuntu-latest
            build_type: Debug
            asan: ON
            transport: none
          - os: macos-latest
            build_type: Release
            asan: OFF
            transport: none
          - os: macos-latest
            build_type: Debug
            asan: ON
            transport: none

          - os: ubuntu-latest
            build_type: Release
            asan: OFF
            transport: level-b
          - os: ubuntu-latest
            build_type: Debug
            asan: ON
            transport: level-b

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Setup python"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: "Install CMake/Ninja"
      uses: lukka/get-cmake@latest

    - name: "Install dependencies (Ubuntu)"
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y \
          libcurl4-openssl-dev libssl-dev pmccabe rsync zlib1g-dev zstd
        python -m pip install --upgrade yq

    - name: "Install dependencies (macOS)"
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install curl openssl zstd
        python -m pip install --upgrade yq

    - name: "Configure"
      # The hosted runners are slow: scale every test deadline, the CTest
      # timeouts included. The scale is a configure option, not a delay.
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_ASAN=${{ matrix.asan }} \
          -DFYAI_TIMEOUT_SCALE=${{ matrix.asan == 'ON' && '6' || '3' }}

    - name: "Build"
      run: |
        cmake --build build

    - name: "Allow user namespaces (Ubuntu)"
      if: runner.os == 'Linux'
      # The hosted runner restricts unprivileged user namespaces with AppArmor. The
      # cases of the sandbox cover need them, so install the profiles that the
      # documentation (doc/apparmor-userns.md) names, for the binary that runs and
      # for bubblewrap. The cases of the views check the host with unshare, which
      # has no profile, and skip, as they did.
      run: |
        sudo apt-get install --no-install-recommends -y bubblewrap apparmor-profiles
        build/fyai sandbox apparmor | sudo tee /etc/apparmor.d/fyai >/dev/null
        # A newer image ships the profile of bubblewrap in its own package, and
        # apparmor-profiles no longer has it: install it only where it exists.
        profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/fyai
        if [ -f "$profile" ]; then
          sudo install -m 644 "$profile" /etc/apparmor.d/
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        fi
        bwrap --version

    - name: "Scan McCabe complexity"
      if: runner.os == 'Linux'
      run: |
        cmake --build build --target pmccabe

    - name: "Test"
      env:
        FYAI_TEST_TRANSPORT: ${{ matrix.transport == 'level-b' && 'level-b' || '' }}
      working-directory: build
      run: |
        # Valgrind cases carry the nightly label: memcheck is an order
        # of magnitude slower and ASAN already covers per-push memory
        # checking. The nightly schedule runs the whole suite.
        # Failed cases keep their sandbox (captures, mock log, requests)
        # under $RUNNER_TEMP for the artifact step below.
        export FYAI_TEST_KEEPDIR="$RUNNER_TEMP/fyai-failures"
        # nproc is GNU; macOS has sysctl instead. Cores only size the
        # job count: PTY wall-clock cases stay serial through the
        # fyai_pty lock whatever it is.
        if command -v nproc >/dev/null 2>&1; then
          jobs="$(nproc)"
        else
          jobs="$(sysctl -n hw.ncpu 2>/dev/null || echo 4)"
        fi
        ctest_args=(-j "$jobs" --output-on-failure)
        if [ "${{ github.event_name }}" != "schedule" ]; then
          ctest_args+=(-LE nightly)
        fi
        if ctest "${ctest_args[@]}"; then
          exit 0
        fi
        for attempt in 2 3; do
          echo "Retrying failed tests (attempt $attempt of 3)"
          if ctest "${ctest_args[@]}" --rerun-failed; then
            exit 0
          fi
        done
        exit 1

    - name: "Upload test logs on failure"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: "test-logs-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.asan }}-${{ matrix.transport }}-${{ github.run_id }}"
        path: |
          build/Testing/Temporary/
          build/**/*.log
          ${{ runner.temp }}/fyai-failures/
