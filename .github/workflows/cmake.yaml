name: CMake CI

run-name: >-
  ${{ github.event_name == 'pull_request'      && format('CMake CI · PR #{0}', github.event.pull_request.number) ||
      github.event_name == 'workflow_dispatch' && format('CMake CI · manual · os={0}', inputs.os || 'all') ||
      format('CMake CI · {0} · {1}', github.ref_name, github.event.head_commit.message) }}

env:
  # No parallelism caps: the build uses every core, and ctest takes
  # -j "$(nproc)" in the Test step. PTY wall-clock cases stay serial
  # through the fyai_pty resource lock whatever the job count is.
  CTEST_OUTPUT_ON_FAILURE: 1

on:
  push:
    branches: [ master, devel ]
  pull_request:
    branches: [ master, devel ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run (e.g. ubuntu-latest, macos-latest)"
        required: false
        default: ""
        type: string
      asan:
        description: "Enable ASAN (ON or OFF)"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}${{ matrix.asan == 'ON' && ' (ASAN)' || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            asan: OFF
          - os: ubuntu-latest
            build_type: Debug
            asan: ON
          - os: macos-latest
            build_type: Release
            asan: OFF
          - os: macos-latest
            build_type: Debug
            asan: ON

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Setup python"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: "Install CMake/Ninja"
      uses: lukka/get-cmake@latest

    - name: "Install dependencies (Ubuntu)"
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y \
          libcurl4-openssl-dev libssl-dev pmccabe zlib1g-dev zstd
        python -m pip install --upgrade yq

    - name: "Install dependencies (macOS)"
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install curl openssl zstd
        python -m pip install --upgrade yq

    - name: "Configure"
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_ASAN=${{ matrix.asan }}

    - name: "Build"
      run: |
        cmake --build build

    - name: "Scan McCabe complexity"
      if: runner.os == 'Linux'
      run: |
        cmake --build build --target pmccabe

    - name: "Test"
      working-directory: build
      run: |
        # Valgrind cases carry the nightly label: memcheck is an order
        # of magnitude slower and ASAN already covers per-push memory
        # checking. The nightly schedule runs the whole suite.
        # Failed cases keep their sandbox (captures, mock log, requests)
        # under $RUNNER_TEMP for the artifact step below.
        export FYAI_TEST_KEEPDIR="$RUNNER_TEMP/fyai-failures"
        # nproc is GNU; macOS has sysctl instead. Cores only size the
        # job count: PTY wall-clock cases stay serial through the
        # fyai_pty lock whatever it is.
        if command -v nproc >/dev/null 2>&1; then
          jobs="$(nproc)"
        else
          jobs="$(sysctl -n hw.ncpu 2>/dev/null || echo 4)"
        fi
        if [ "${{ github.event_name }}" = "schedule" ]; then
          ctest -j "$jobs" --output-on-failure
        else
          ctest -j "$jobs" --output-on-failure -LE nightly
        fi

    - name: "Upload test logs on failure"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: "test-logs-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.asan }}-${{ github.run_id }}"
        path: |
          build/Testing/Temporary/
          build/**/*.log
          ${{ runner.temp }}/fyai-failures/
